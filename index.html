<!DOCTYPE html>
<html lang="sv">
<head>

<link rel="apple-touch-icon" sizes="180x180" href="icons/routine-icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#7C8A6B">
<link rel="icon" type="image/png" sizes="32x32" href="icons/routine-icon-32.png">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Rutiner">

  <title>Otis, Loui & Teddys Rutiner</title>

  <style>
    :root {
      --paper: #F4F0E8;
      --card: #FBFAF6;
      --ink: #3A3833;
      --muted: #8C8578;
      --faint: #B7B0A2;
      --line: #E8E2D5;
      --accent: #7C8A6B;
      --accent-hover: #6C7A5C;
      --task-bg: #F6F3EB;
      --task-bg-hover: #F0EBDF;
      --serif: ui-serif, Georgia, "Iowan Old Style", Palatino, serif;
      --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      font-family: var(--sans);
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      transition: background 0.4s ease;
      -webkit-font-smoothing: antialiased;
    }

    header { padding: 18px 16px 4px; }
    .app-bar {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .app-icon {
      width: 30px; height: 30px;
      border-radius: 8px;
      flex-shrink: 0;
      cursor: pointer;
    }
    header h1 {
      margin: 0;
      font-family: var(--serif);
      font-weight: 500;
      font-size: 22px;
      letter-spacing: 0.2px;
    }

    .routine-toggle {
      display: inline-flex;
      background: #E7E1D3;
      border-radius: 999px;
      padding: 3px;
      gap: 2px;
    }
    .routine-toggle button {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 7px 15px;
      border-radius: 999px;
      font-size: 14px;
      cursor: pointer;
      transition: color 0.2s;
    }
    .routine-toggle button.active {
      background: var(--card);
      color: var(--ink);
      box-shadow: 0 1px 2px rgba(0,0,0,0.08);
    }

    #children-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
      max-width: 1100px;
      margin: 18px auto 0;
      padding: 0 16px;
    }

    .child-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px 16px 18px;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .child-card.complete {
      border-color: var(--accent);
      box-shadow: inset 0 0 0 1px var(--accent);
    }

    .child-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
    }
    .child-header h3 {
      margin: 0;
      font-family: var(--serif);
      font-weight: 500;
      font-size: 21px;
    }
    .stars {
      font-size: 14px;
      color: var(--muted);
      white-space: nowrap;
    }

    .progress-bar {
      height: 6px;
      background: #EDE8DC;
      border-radius: 3px;
      overflow: hidden;
      margin: 12px 0 14px;
    }
    .progress-fill {
      height: 100%;
      width: 0;
      background: var(--accent);
      border-radius: 3px;
      transition: width 0.45s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .task-list { display: flex; flex-direction: column; gap: 7px; }

    .task {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 12px;
      border-radius: 12px;
      background: var(--task-bg);
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s, transform 0.1s;
    }
    .task:hover { background: var(--task-bg-hover); }
    .task:active { transform: scale(0.99); }

    .task-check {
      flex: 0 0 auto;
      width: 24px; height: 24px;
      border-radius: 50%;
      border: 2px solid #D3CBB8;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.25s, border-color 0.25s;
    }
    .task-check .tick {
      opacity: 0;
      transform: scale(0.5);
      transition: opacity 0.2s, transform 0.2s;
    }
    .task.done .task-check {
      background: var(--accent);
      border-color: var(--accent);
      animation: checkPop 0.3s ease;
    }
    .task.done .task-check .tick { opacity: 1; transform: scale(1); }
    @keyframes checkPop {
      0% { transform: scale(1); }
      40% { transform: scale(1.18); }
      100% { transform: scale(1); }
    }

    .task-text {
      flex: 1;
      font-size: 15px;
      line-height: 1.3;
    }
    .task.done .task-text {
      color: var(--faint);
      text-decoration: line-through;
    }

    .task-menu {
      flex: 0 0 auto;
      background: transparent;
      border: 0;
      color: #CBC3B1;
      font-size: 20px;
      line-height: 1;
      padding: 2px 6px;
      border-radius: 6px;
      cursor: pointer;
    }
    .task-menu:hover { color: var(--muted); background: #ECE7DB; }

    .pet-scene {
      position: relative;
      height: 168px;
      margin: 0 0 12px;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .world-bg { position: absolute; inset: 0; z-index: 0; }
    .world-bg svg { width: 100%; height: 100%; display: block; }
    .pet-svg { position: relative; z-index: 1; width: 100%; height: 100%; display: block; }
    .world-swap {
      position: absolute; top: 8px; right: 8px; z-index: 2;
      width: 30px; height: 30px; border-radius: 50%; padding: 0;
      border: 0; background: rgba(255,255,255,0.32); color: #fff;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
    }
    .world-swap:hover { background: rgba(255,255,255,0.5); }

    .grow { transform-box: fill-box; transform-origin: 50% 100%; transition: transform 0.5s cubic-bezier(0.2,0.85,0.25,1); }
    .float { transform-box: fill-box; animation: floatY 6s ease-in-out infinite; }
    .shake.go { animation: pshake 0.5s ease-in-out; }
    .breathe { transform-box: fill-box; transform-origin: 50% 100%; animation: breathe 4.2s ease-in-out infinite; }
    .tail { transform-box: fill-box; transform-origin: 82% 26%; animation: tailSway 3.6s ease-in-out infinite; }
    .eyelid { transform-box: fill-box; transform-origin: 50% 0%; transform: scaleY(0); animation: blink 5.4s ease-in-out infinite; }
    .hop.go { animation: phop 0.62s cubic-bezier(0.3,0.9,0.3,1); }
    .bodyform { display: none; }
    .bodyform.active { display: block; }
    .trait { opacity: 0; transform-box: fill-box; transform-origin: 50% 100%; transform: scale(0) translateY(6px); transition: opacity 0.3s, transform 0.45s cubic-bezier(0.2,1.6,0.4,1); }
    .trait.on { opacity: 1; transform: scale(1) translateY(0); }
    .firetail.on .flame, .jetpack.on .flame { animation: flick 0.4s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 0%; }
    .bolt.on .zap { animation: zap 1s steps(2) infinite; }
    .drone.on .rotor { animation: spin 0.12s linear infinite; transform-box: fill-box; transform-origin: 50% 50%; }
    .burst { opacity: 0; transform-box: fill-box; transform-origin: 50% 50%; }
    .burst.go { animation: burst 0.55s ease-out; }
    .pet-spark { opacity: 0; transform-box: fill-box; transform-origin: 50% 50%; }
    .pet-svg.party .pet-spark { animation: sparkle 1.4s ease-in-out infinite; }
    .pet-svg.party .pet-spark.b { animation-delay: 0.5s; }
    .pet-svg.party .pet-spark.c { animation-delay: 0.95s; }
    @keyframes floatY { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
    @keyframes breathe { 0%,100%{transform:scale(1)} 50%{transform:scale(1.03,1.04)} }
    @keyframes tailSway { 0%,100%{transform:rotate(-9deg)} 50%{transform:rotate(9deg)} }
    @keyframes blink { 0%,90%,100%{transform:scaleY(0)} 93%,96%{transform:scaleY(1)} }
    @keyframes phop { 0%{transform:translateY(0) scaleY(1)} 18%{transform:translateY(2px) scaleY(0.9)} 45%{transform:translateY(-30px) scaleY(1.06)} 70%{transform:translateY(0) scaleY(0.93)} 100%{transform:translateY(0) scaleY(1)} }
    @keyframes pshake { 0%,100%{transform:translateX(0) rotate(0)} 20%{transform:translateX(-5px) rotate(-3deg)} 40%{transform:translateX(5px) rotate(3deg)} 60%{transform:translateX(-4px) rotate(-2deg)} 80%{transform:translateX(3px) rotate(1deg)} }
    @keyframes flick { 0%{transform:scaleY(1)} 100%{transform:scaleY(1.22) scaleX(0.92)} }
    @keyframes zap { 0%,100%{opacity:0.25} 50%{opacity:1} }
    @keyframes spin { 0%{transform:scaleX(1)} 100%{transform:scaleX(-1)} }
    @keyframes burst { 0%{opacity:0.85; transform:scale(0.2)} 100%{opacity:0; transform:scale(1.5)} }
    @keyframes sparkle { 0%,100%{opacity:0; transform:scale(0.6)} 50%{opacity:1; transform:scale(1.12)} }

    .admin {
      width: min(560px, 94vw);
      max-height: 88vh;
      overflow-y: auto;
      background: var(--card);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 12px 34px rgba(0,0,0,0.22);
      text-align: left;
    }
    .admin-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .admin-x { background: transparent; border: 0; font-size: 16px; color: var(--muted); cursor: pointer; }
    .admin-label { font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--faint); margin: 4px 0 8px; }
    .admin-lists { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    .admin-chip { border: 1px solid var(--line); background: #F3EFE7; color: var(--ink); border-radius: 999px; padding: 7px 14px; font-size: 14px; cursor: pointer; }
    .admin-chip.active { background: var(--accent); color: #FBFAF6; border-color: var(--accent); }
    .admin-chip.add { border-style: dashed; color: var(--muted); background: transparent; }
    .admin-chip.inactive { opacity: 0.45; }
    .admin-chip.inactive.active { opacity: 0.7; }
    .admin-listbar { display: flex; gap: 8px; margin-bottom: 16px; }
    .admin-mini { background: transparent; border: 1px solid var(--line); color: var(--muted); border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
    .admin-mini.danger { color: #B4614E; border-color: #E4C3BB; }
    .admin-tasks { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
    .admin-task { display: flex; align-items: center; gap: 8px; }
    .admin-task-text { flex: 1; min-width: 0; padding: 9px 10px; border: 1px solid var(--line); border-radius: 10px; font-size: 15px; font-family: var(--sans); color: var(--ink); background: #fff; }
    .admin-who { display: flex; gap: 5px; flex-shrink: 0; }
    .admin-pill { border: 1px solid var(--line); background: #F3EFE7; color: var(--muted); border-radius: 999px; padding: 5px 9px; font-size: 12px; cursor: pointer; }
    .admin-pill.on { background: var(--accent); color: #FBFAF6; border-color: var(--accent); }
    .admin-del { background: transparent; border: 0; color: #C3382A; font-size: 14px; cursor: pointer; padding: 4px 6px; flex-shrink: 0; }
    .admin-empty { color: var(--muted); font-size: 14px; padding: 8px 2px; }
    .admin-add { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; border-top: 1px solid var(--line); padding-top: 14px; }
    .admin-add input { flex: 1 1 160px; min-width: 0; padding: 10px; border: 1px solid var(--line); border-radius: 10px; font-size: 15px; font-family: var(--sans); color: var(--ink); background: #fff; }
    .admin-add-who { display: flex; gap: 5px; }
    .admin-add-btn { background: var(--accent); color: #FBFAF6; border: 0; border-radius: 10px; padding: 10px 16px; font-size: 14px; cursor: pointer; }

    .reset-container { text-align: center; margin: 22px 0 28px; }
    #manualResetBtn {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--muted);
      border-radius: 999px;
      padding: 9px 20px;
      font-size: 14px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }
    #manualResetBtn:hover { border-color: var(--faint); color: var(--ink); }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(45, 43, 38, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    .hidden { display: none; }
    .modal {
      width: min(340px, 90vw);
      background: var(--card);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 12px 34px rgba(0,0,0,0.22);
      text-align: left;
    }
    .modal-title { font-family: var(--serif); font-size: 17px; margin-bottom: 12px; }
    .modal-actions { display: flex; gap: 10px; justify-content: space-between; }
    .modal-btn {
      flex: 1;
      padding: 10px 12px;
      border-radius: 12px;
      border: none;
      background: var(--accent);
      color: #FBFAF6;
      cursor: pointer;
      font-size: 15px;
    }
    .modal-btn:hover { background: var(--accent-hover); }
    .modal-btn.secondary { background: #9C978A; }
    .modal-btn.danger { background: #B4614E; }
    .modal label { font-size: 14px; color: var(--muted); }
    .modal select, .modal input {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--line);
      font-size: 16px;
      margin-top: 4px;
      font-family: var(--sans);
      color: var(--ink);
      background: #fff;
    }
  </style>
</head>

<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <linearGradient id="petFire" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#D9542E"/><stop offset="0.5" stop-color="#E88C36"/><stop offset="1" stop-color="#F3C86A"/></linearGradient>
    <radialGradient id="petFlash" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
    <linearGradient id="wCity" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8C93B8"/><stop offset="0.55" stop-color="#C6A9BE"/><stop offset="1" stop-color="#E8C79E"/></linearGradient>
    <linearGradient id="wJungle" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E3EAD3"/><stop offset="1" stop-color="#CBDDBE"/></linearGradient>
    <linearGradient id="wSpace" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#23264A"/><stop offset="1" stop-color="#3E3760"/></linearGradient>
  </defs></svg>

  <header>
    <div class="app-bar">
      <div class="brand">
        <img src="icons/routine-icon-180.png" alt="" class="app-icon">
        <h1>Rutiner</h1>
      </div>
      <div class="routine-toggle" id="routine-toggle"></div>
    </div>
  </header>

  <div id="children-container"></div>

  <div class="reset-container">
    <button id="manualResetBtn">Återställ</button>
  </div>

  <div id="taskMenuOverlay" class="overlay hidden">
    <div class="modal">
      <div class="modal-title">Välj</div>
      <div class="modal-actions">
        <button id="taskMenuEditBtn" class="modal-btn">Redigera</button>
        <button id="taskMenuDeleteBtn" class="modal-btn danger">Ta bort</button>
        <button id="taskMenuCancelBtn" class="modal-btn secondary">Avbryt</button>
      </div>
    </div>
  </div>

  <div id="adminOverlay" class="overlay hidden">
    <div class="admin">
      <div class="admin-head">
        <div class="modal-title">Admin</div>
        <button id="adminCloseBtn" class="admin-x" type="button" aria-label="Stäng">✕</button>
      </div>
      <div class="admin-label">Listor</div>
      <div class="admin-lists" id="adminLists"></div>
      <div class="admin-listbar">
        <button id="adminToggleActiveBtn" class="admin-mini" type="button">Dölj lista</button>
        <button id="adminRenameBtn" class="admin-mini" type="button">Byt namn</button>
        <button id="adminDeleteListBtn" class="admin-mini danger" type="button">Ta bort lista</button>
      </div>
      <div class="admin-label">Uppgifter</div>
      <div class="admin-tasks" id="adminTasks"></div>
      <div class="admin-add">
        <input id="adminNewTask" type="text" placeholder="Ny uppgift…">
        <div class="admin-add-who" id="adminNewWho"></div>
        <button id="adminAddBtn" class="admin-add-btn" type="button">Lägg till</button>
      </div>
    </div>
  </div>

  <!-- Supabase (loaded but dormant until CLOUD_SYNC is turned on) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const STORAGE_KEY = 'routineData_v2';
    const defaultChildren = ['Teddy', 'Otis', 'Loui'];
    let data;

    // ===== Supabase sync (shared Familje-Mello project) =====
    // Cross-device sync. If the (free) project auto-pauses or is unreachable,
    // the app silently falls back to localStorage and re-syncs when it returns.
    const CLOUD_SYNC = true;
    const SUPABASE_URL = 'https://bhurxoknmyfqymtiaycx.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJodXJ4b2tubXlmcXltdGlheWN4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5NzI5NTAsImV4cCI6MjA5NzU0ODk1MH0.YbblDF0jfZNzdIMy8rMF3t19b7b6onD91VVLi9N8kYg';
    const HOUSEHOLD_ID = 'c16b0799-e72b-4318-99e1-12661b9f6e02';

    const CLIENT_ID = 'c_' + Math.random().toString(36).slice(2, 10);
    let sb = null;
    let applyingRemote = false;
    let pushTimer = null;

    function syncEnabled() {
      return CLOUD_SYNC && !!sb && HOUSEHOLD_ID && HOUSEHOLD_ID.indexOf('__') !== 0;
    }

    function initSupabase() {
      try {
        if (!CLOUD_SYNC) return;
        if (!HOUSEHOLD_ID || HOUSEHOLD_ID.indexOf('__') === 0) return;
        if (window.supabase && window.supabase.createClient) {
          sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }
      } catch (e) { console.warn('Supabase init failed', e); }
    }

    function routineIds() { return data.routines.map(r => r.id); }
    function routineName(id) { const r = data.routines.find(x => x.id === id); return r ? r.name : id; }

    function normalizeData() {
      if (!data || !Array.isArray(data.children)) return;
      if (!Array.isArray(data.routines) || !data.routines.length) {
        data.routines = [{ id: 'morgon', name: 'Morgon' }, { id: 'kväll', name: 'Kväll' }, { id: 'helg', name: 'Helg' }];
      }
      const ids = data.routines.map(r => r.id);
      if (!data.routine || ids.indexOf(data.routine) < 0) data.routine = ids[0];
      data.routines.forEach(r => { if (r.active === undefined) r.active = true; });
      const activeIds = data.routines.filter(r => r.active !== false).map(r => r.id);
      if (activeIds.length && activeIds.indexOf(data.routine) < 0) data.routine = activeIds[0];
      data.children.forEach((ch, idx) => {
        if (!ch.world) ch.world = ['city', 'jungle', 'space'][idx % 3];
        if (!ch.tasks) ch.tasks = {};
        ids.forEach(r => { if (!Array.isArray(ch.tasks[r])) ch.tasks[r] = []; });
      });
      // Ensure ids + shared group-ids (identical text in a list shares one gid)
      ids.forEach(listId => {
        const textGid = {};
        data.children.forEach(ch => {
          ch.tasks[listId].forEach(t => {
            if (!t.id) t.id = makeId();
            if (t.gid) textGid[t.text] = t.gid;
            else { if (!textGid[t.text]) textGid[t.text] = 'g_' + makeId(); t.gid = textGid[t.text]; }
          });
        });
      });
      return;
      // legacy loop retained below (unreachable)
      data.children.forEach((ch) => {
        ['morgon', 'kväll', 'helg'].forEach(r => {
          if (!ch.tasks[r]) ch.tasks[r] = [];
          ch.tasks[r].forEach(t => { if (!t.id) t.id = makeId(); });
        });
      });
    }

    function schedulePush() {
      if (!syncEnabled() || applyingRemote) return;
      clearTimeout(pushTimer);
      pushTimer = setTimeout(pushState, 400);
    }
    async function pushState() {
      if (!syncEnabled()) return;
      try {
        const payload = Object.assign({}, data, { _src: CLIENT_ID });
        await sb.from('households').update({ state: payload, updated_at: new Date().toISOString() }).eq('id', HOUSEHOLD_ID);
      } catch (e) { console.warn('Push failed', e); }
    }
    async function pullState() {
      if (!syncEnabled()) return;
      try {
        const { data: row, error } = await sb.from('households').select('state').eq('id', HOUSEHOLD_ID).single();
        if (error) throw error;
        const remote = row && row.state;
        if (remote && Array.isArray(remote.children) && remote.children.length) {
          if (remote._src === CLIENT_ID) return;
          if (remoteIsNewer(remote)) adoptRemote(remote);
          else pushState();
        } else { pushState(); }
      } catch (e) { console.warn('Pull failed', e); }
    }
    function adoptRemote(remote) {
      applyingRemote = true;
      data = remote;
      normalizeData();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      applyingRemote = false;
      applyThemeForRoutine();
      renderRoutineTabs();
      render();
    }
    function subscribeRealtime() {
      if (!syncEnabled()) return;
      sb.channel('household-' + HOUSEHOLD_ID)
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'households', filter: 'id=eq.' + HOUSEHOLD_ID },
          (payload) => {
            const remote = payload.new && payload.new.state;
            if (!remote || remote._src === CLIENT_ID) return;
            if (remoteIsNewer(remote)) adoptRemote(remote);
          })
        .subscribe();
    }

    function todayStockholm() {
      return new Date().toLocaleDateString('sv-SE', { timeZone: 'Europe/Stockholm' });

    // ===== Task menu (edit / delete) =====
    let taskMenuState = null;
    function openTaskMenu(childIndex, taskId) {
      taskMenuState = { childIndex, taskId };
      document.getElementById('taskMenuOverlay').classList.remove('hidden');
    }
    function closeTaskMenu() {
      taskMenuState = null;
      document.getElementById('taskMenuOverlay').classList.add('hidden');
    }
    const overlayEl = document.getElementById('taskMenuOverlay');
    document.getElementById('taskMenuCancelBtn').addEventListener('click', closeTaskMenu);
    overlayEl.addEventListener('click', (e) => { if (e.target === overlayEl) closeTaskMenu(); });

    document.getElementById('taskMenuDeleteBtn').addEventListener('click', () => {
      if (!taskMenuState) return;
      if (!window.confirm('Ta bort?')) return;
      const { childIndex, taskId } = taskMenuState;
      const arr = data.children[childIndex].tasks[data.routine];
      const idx = arr.findIndex(t => t.id === taskId);
      if (idx >= 0) arr.splice(idx, 1);
      saveData();
      closeTaskMenu();
      render();
    });

    document.getElementById('taskMenuEditBtn').addEventListener('click', () => {
      if (!taskMenuState) return;
      const { childIndex, taskId } = taskMenuState;
      const arr = data.children[childIndex].tasks[data.routine];
      const task = arr.find(t => t.id === taskId);
      if (!task) { closeTaskMenu(); return; }
      const newText = window.prompt('Redigera uppgift:', task.text);
      if (newText === null) return;
      const trimmed = newText.trim();
      if (!trimmed) return;
      task.text = trimmed;
      saveData();
      closeTaskMenu();
      render();
    });

    // ===== Hidden parent mode: tap app icon 7 times =====
    let secretTaps = 0;
    let secretTimer = null;

    let adminListId = null;

    function openAdmin() {
      adminListId = data.routine;
      document.getElementById('adminOverlay').classList.remove('hidden');
      renderAdmin();
    }
    function closeAdmin() {
      document.getElementById('adminOverlay').classList.add('hidden');
      applyThemeForRoutine();
      renderRoutineTabs();
      render();
    }
    const adminOverlayEl = document.getElementById('adminOverlay');
    adminOverlayEl.addEventListener('click', (e) => { if (e.target === adminOverlayEl) closeAdmin(); });
    document.getElementById('adminCloseBtn').addEventListener('click', closeAdmin);

    // Group each list's per-child tasks by shared gid into one editable row.
    function taskGroups(listId) {
      const groups = []; const byGid = {};
      data.children.forEach(ch => (ch.tasks[listId] || []).forEach(t => {
        let g = byGid[t.gid];
        if (!g) { g = { gid: t.gid, text: t.text, members: {} }; byGid[t.gid] = g; groups.push(g); }
        g.members[ch.name] = t.id;
      }));
      return groups;
    }
    function toggleAssign(listId, g, childName) {
      const ch = data.children.find(c => c.name === childName);
      if (!ch) return;
      const arr = ch.tasks[listId] || (ch.tasks[listId] = []);
      const idx = arr.findIndex(t => t.gid === g.gid);
      if (idx >= 0) arr.splice(idx, 1);
      else arr.push({ id: makeId(), gid: g.gid, text: g.text, completed: false });
      saveData();
    }

    function renderAdmin() {
      if (routineIds().indexOf(adminListId) < 0) adminListId = data.routine;

      const listsEl = document.getElementById('adminLists');
      listsEl.innerHTML = '';
      data.routines.forEach(r => {
        const b = document.createElement('button');
        b.className = 'admin-chip' + (r.id === adminListId ? ' active' : '') + (r.active === false ? ' inactive' : '');
        b.type = 'button';
        b.textContent = r.name;
        b.addEventListener('click', () => { adminListId = r.id; renderAdmin(); });
        listsEl.appendChild(b);
      });
      const curList = data.routines.find(r => r.id === adminListId);
      const tgl = document.getElementById('adminToggleActiveBtn');
      if (tgl) tgl.textContent = (curList && curList.active === false) ? 'Visa lista' : 'Dölj lista';
      const addList = document.createElement('button');
      addList.className = 'admin-chip add';
      addList.type = 'button';
      addList.textContent = '+ Ny lista';
      addList.addEventListener('click', () => {
        const name = window.prompt('Namn på ny lista:', '');
        if (!name || !name.trim()) return;
        const id = 'l_' + makeId();
        data.routines.push({ id, name: name.trim(), active: true });
        data.children.forEach(ch => { ch.tasks[id] = []; });
        adminListId = id;
        saveData(); renderAdmin();
      });
      listsEl.appendChild(addList);

      const tasksEl = document.getElementById('adminTasks');
      tasksEl.innerHTML = '';
      const groups = taskGroups(adminListId);
      groups.forEach(g => {
        const row = document.createElement('div');
        row.className = 'admin-task';
        const input = document.createElement('input');
        input.className = 'admin-task-text';
        input.value = g.text;
        input.addEventListener('change', () => {
          const v = input.value.trim();
          if (!v) { input.value = g.text; return; }
          data.children.forEach(ch => (ch.tasks[adminListId] || []).forEach(t => { if (t.gid === g.gid) t.text = v; }));
          g.text = v;
          saveData();
        });
        const who = document.createElement('div');
        who.className = 'admin-who';
        data.children.forEach(ch => {
          const p = document.createElement('button');
          p.className = 'admin-pill' + (g.members[ch.name] ? ' on' : '');
          p.type = 'button';
          p.textContent = ch.name;
          p.title = ch.name;
          p.addEventListener('click', () => { toggleAssign(adminListId, g, ch.name); renderAdmin(); });
          who.appendChild(p);
        });
        const del = document.createElement('button');
        del.className = 'admin-del';
        del.type = 'button';
        del.textContent = '✕';
        del.setAttribute('aria-label', 'Ta bort');
        del.addEventListener('click', () => {
          data.children.forEach(ch => {
            const arr = ch.tasks[adminListId] || [];
            for (let i = arr.length - 1; i >= 0; i--) if (arr[i].gid === g.gid) arr.splice(i, 1);
          });
          saveData(); renderAdmin();
        });
        row.appendChild(input); row.appendChild(who); row.appendChild(del);
        tasksEl.appendChild(row);
      });
      if (!groups.length) {
        const empty = document.createElement('div');
        empty.className = 'admin-empty';
        empty.textContent = 'Inga uppgifter än. Lägg till nedan.';
        tasksEl.appendChild(empty);

      const whoNew = document.getElementById('adminNewWho');
      whoNew.innerHTML = '';
      data.children.forEach(ch => {
        const p = document.createElement('button');
        p.className = 'admin-pill on';
        p.type = 'button';
        p.dataset.child = ch.name;
        p.textContent = ch.name;
        p.addEventListener('click', () => p.classList.toggle('on'));
        whoNew.appendChild(p);
      });
    }

    document.getElementById('adminAddBtn').addEventListener('click', () => {

      if (!text) return;
      const who = [...document.querySelectorAll('#adminNewWho .admin-pill.on')].map(p => p.dataset.child);
      const targets = who.length ? who : data.children.map(c => c.name);
      const gid = 'g_' + makeId();
      targets.forEach(name => {
        const ch = data.children.find(c => c.name === name);
        (ch.tasks[adminListId] || (ch.tasks[adminListId] = [])).push({ id: makeId(), gid, text, completed: false });

      const r = data.routines.find(x => x.id === adminListId);
      if (!r) return;

      if (currentlyActive && data.routines.filter(x => x.active !== false).length <= 1) {
        alert('Minst en lista måste vara aktiv.');
        return;
      }
      r.active = !currentlyActive;
      if (r.active === false && data.routine === r.id) {
        const firstActive = data.routines.find(x => x.active !== false);
        if (firstActive) data.routine = firstActive.id;
      }
      saveData();
      renderAdmin();

      if (!name || !name.trim()) return;
      r.name = name.trim();
      saveData(); renderAdmin();

      if (data.routines.length <= 1) { alert('Det måste finnas minst en lista.'); return; }

      if (!r) return;

      morgon: { '--paper': '#F4F0E8', '--accent': '#7C8A6B', '--accent-hover': '#6C7A5C' },
      kväll:  { '--paper': '#ECEAF1', '--accent': '#6E6690', '--accent-hover': '#5C5580' },
      helg:   { '--paper': '#F5EFE4', '--accent': '#5E8A82', '--accent-hover': '#4E7A72' }

    const DEFAULT_THEMES = [
      { '--paper': '#EFEDE6', '--accent': '#8A7E6A', '--accent-hover': '#786D5B' },

    function applyThemeForRoutine() {
      let theme = THEMES[data.routine];
      if (!theme) {
        const idx = Math.max(0, routineIds().indexOf(data.routine));
        theme = DEFAULT_THEMES[idx % DEFAULT_THEMES.length];
      }
      const root = document.documentElement;
      Object.entries(theme).forEach(([k, v]) => root.style.setProperty(k, v));
    }

    function makeId() {
      return 't_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
    }

    function initData() {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored) {
        data = JSON.parse(stored);
        normalizeData();
        saveData();
        return;
      }
      data = {
        routine: 'morgon',
        lastReset: null,
        routines: [{ id: 'morgon', name: 'Morgon' }, { id: 'kväll', name: 'Kväll' }, { id: 'helg', name: 'Helg' }],
        children: defaultChildren.map((name, idx) => ({ name, world: ['city', 'jungle', 'space'][idx % 3], tasks: { morgon: [], kväll: [], helg: [] } }))
      };
      data.children.forEach(child => {
        const preset = STARTER_TASKS[child.name];
        if (!preset) return;
        ['morgon', 'kväll', 'helg'].forEach(r => {
          (preset[r] || []).forEach(text => {
            child.tasks[r].push({ id: makeId(), text, completed: false });
          });
        });
      });
      normalizeData();
      saveData();
    }

    function saveData() {
      if (!applyingRemote) data.updatedAt = new Date().toISOString();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      schedulePush();
    }
    function remoteIsNewer(remote) {
      return (remote.updatedAt || '') > (data.updatedAt || '');
    }

    // Clear yesterday's checks on the first open of a new day.
    function checkDailyReset() {
      const today = todayStockholm();
      if (!data.lastReset) { data.lastReset = today; saveData(); return; }
      if (data.lastReset !== today) {
        data.children.forEach(ch => {
          routineIds().forEach(r => (ch.tasks[r] || []).forEach(t => t.completed = false));
        });
        data.lastReset = today;
        saveData();
      }
    }

    function doneCount(child) {
      return child.tasks[data.routine].filter(t => t.completed).length;
    }

    // ===== Pet (evolving creature, daily-fresh per child) =====
    const PET_MAX = 5;
    const PET_SLOTS = {
      head: ['horn', 'crown', 'headphones'],
      face: ['glasses', 'gem'],
      back: ['wings', 'cape', 'sword', 'staff', 'jetpack', 'drone'],
      hand: ['claws', 'tnt'],
      feet: ['bigboots'],
      tail: ['firetail'],
      aura: ['bolt']
    };
    const PET_ALL = Object.keys(PET_SLOTS).reduce((a, k) => a.concat(PET_SLOTS[k]), []);
    const petStage = {};

    function petHash(str) { let h = 1779033703 ^ str.length; for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; } return h >>> 0; }
    function petRng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
    function petShuffle(a, rnd) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
    function petOrder(childName) {
      const rnd = petRng(petHash(childName + '|' + todayStockholm()));
      const slots = petShuffle(Object.keys(PET_SLOTS), rnd).slice(0, PET_MAX);
      return slots.map(s => { const o = PET_SLOTS[s]; return o[Math.floor(rnd() * o.length)]; });
    }
    function petFormFor(stage) { return stage === 0 ? 'cub' : stage <= 2 ? 'child' : 'adult'; }
    function replay(el) { if (!el) return; el.classList.remove('go'); void el.offsetWidth; el.classList.add('go'); }

    function refreshPet(i, animate) {
      const svg = document.querySelector('#card-' + i + ' .pet-svg');
      if (!svg) return;
      const child = data.children[i];
      const total = child.tasks[data.routine].length;
      const done = doneCount(child);
      const stage = total ? Math.round(done / total * PET_MAX) : 0;
      const form = petFormFor(stage);

      ['cub', 'child', 'adult'].forEach(f => {
        const b = svg.querySelector('.body-' + f);
        if (b) b.classList.toggle('active', f === form);
      });
      const grow = svg.querySelector('.grow');
      if (grow) grow.style.transform = 'scale(' + (0.6 + 0.08 * stage).toFixed(3) + ')';

      const order = petOrder(child.name);
      PET_ALL.forEach(id => { const el = svg.querySelector('.tr-' + id); if (el) el.classList.remove('on'); });
      for (let k = 0; k < stage; k++) { const el = svg.querySelector('.tr-' + order[k]); if (el) el.classList.add('on'); }
      svg.classList.toggle('party', total > 0 && stage >= PET_MAX);

      const prev = petStage[i] == null ? stage : petStage[i];
      if (animate && stage > prev) {
        replay(svg.querySelector('.hop'));
        replay(svg.querySelector('.burst'));
        if (petFormFor(prev) !== form) replay(svg.querySelector('.shake'));
      }
      petStage[i] = stage;
    }

    // ===== Worlds (swappable backdrop per child) =====
    const WORLDS = ['city', 'jungle', 'space'];
    function worldMarkup(world) {
      if (world === 'jungle') return `<svg viewBox="0 0 300 168" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><rect width="300" height="168" fill="url(#wJungle)"/><ellipse cx="120" cy="70" rx="130" ry="30" fill="#FFFFFF" opacity="0.18"/><g fill="#9CB182"><ellipse cx="40" cy="150" rx="80" ry="46"/><ellipse cx="250" cy="146" rx="86" ry="50"/></g><g fill="#6E8B5D"><ellipse cx="120" cy="168" rx="96" ry="46"/><ellipse cx="280" cy="164" rx="70" ry="40"/></g><g fill="#4E6A43"><ellipse cx="150" cy="182" rx="132" ry="40"/><ellipse cx="20" cy="176" rx="60" ry="34"/></g><path d="M26 0 q14 34 3 62 q-12 -8 -9 -30 q-3 18 3 34" fill="#6E8B5D" opacity="0.85"/></svg>`;
      if (world === 'space') return `<svg viewBox="0 0 300 168" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><rect width="300" height="168" fill="url(#wSpace)"/><g fill="#EFE9D4"><circle cx="30" cy="26" r="1.4"/><circle cx="70" cy="16" r="1"/><circle cx="120" cy="30" r="1.5"/><circle cx="180" cy="20" r="1.1"/><circle cx="230" cy="34" r="1.2"/><circle cx="270" cy="22" r="1"/><circle cx="20" cy="70" r="1"/><circle cx="285" cy="76" r="1.3"/><circle cx="150" cy="14" r="1"/><circle cx="255" cy="60" r="0.9"/><circle cx="45" cy="110" r="1"/></g><g transform="translate(244,40) rotate(-18)"><circle cx="0" cy="0" r="15" fill="#C89A76"/><ellipse cx="0" cy="0" rx="27" ry="8" fill="none" stroke="#E0CBAE" stroke-width="2.5"/></g></svg>`;
      return `<svg viewBox="0 0 300 168" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><rect width="300" height="168" fill="url(#wCity)"/><circle cx="248" cy="34" r="13" fill="#F1E8D3" opacity="0.9"/><g fill="#787C97"><rect x="6" y="86" width="26" height="82"/><rect x="40" y="76" width="20" height="92"/><rect x="240" y="80" width="26" height="88"/><rect x="272" y="92" width="22" height="76"/></g><g fill="#565A79"><rect x="28" y="102" width="28" height="66"/><rect x="66" y="92" width="26" height="76"/><rect x="196" y="96" width="28" height="72"/><rect x="252" y="104" width="24" height="64"/></g><g fill="#3F4260"><rect x="96" y="112" width="34" height="56"/><rect x="140" y="118" width="40" height="50"/><rect x="184" y="114" width="32" height="54"/></g><g fill="#EBBB7A"><rect x="104" y="120" width="5" height="6"/><rect x="116" y="120" width="5" height="6"/><rect x="150" y="126" width="5" height="6"/><rect x="164" y="126" width="5" height="6"/><rect x="192" y="122" width="5" height="6"/></g></svg>`;
    }
    function cycleWorld(i) {
      const cur = data.children[i].world || 'city';
      const next = WORLDS[(WORLDS.indexOf(cur) + 1) % WORLDS.length];
      data.children[i].world = next;
      saveData();
      const bg = document.querySelector('#card-' + i + ' .world-bg');
      if (bg) bg.innerHTML = worldMarkup(next);
    }
    // ===== end Pet =====

    function updateCardMeta(i) {
      const child = data.children[i];
      const total = child.tasks[data.routine].length;
      const done = doneCount(child);
      const c = document.getElementById('count-' + i);
      if (c) c.textContent = done + (total ? ' / ' + total : '');
      const f = document.getElementById('fill-' + i);
      if (f) f.style.width = (total ? Math.round(done / total * 100) : 0) + '%';
      const card = document.getElementById('card-' + i);
      if (card) card.classList.toggle('complete', total > 0 && done === total);
    }

    function render() {
      const container = document.getElementById('children-container');
      container.innerHTML = '';

      data.children.forEach((child, childIndex) => {
        const total = child.tasks[data.routine].length;
        const done = doneCount(child);

        const card = document.createElement('div');
        card.className = 'child-card' + (total > 0 && done === total ? ' complete' : '');
        card.id = 'card-' + childIndex;

        const petScene = document.createElement('div');
        petScene.className = 'pet-scene';
        petScene.innerHTML = '<div class="world-bg">' + worldMarkup(child.world) + '</div>' + petMarkup() +
          '<button class="world-swap" type="button" aria-label="Byt bakgrund"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19l6-8 4 5 3-4 5 7z"/><circle cx="7.5" cy="7" r="2.5"/></svg></button>';
        petScene.querySelector('.world-swap').addEventListener('click', (e) => { e.stopPropagation(); cycleWorld(childIndex); });
        card.appendChild(petScene);

        const header = document.createElement('div');
        header.className = 'child-header';
        const nameElem = document.createElement('h3');
        nameElem.textContent = child.name;
        const starElem = document.createElement('div');
        starElem.className = 'stars';
        starElem.innerHTML = `<span id="count-${childIndex}">${done}${total ? ' / ' + total : ''}</span> ⭐`;
        header.appendChild(nameElem);
        header.appendChild(starElem);
        card.appendChild(header);

        const bar = document.createElement('div');
        bar.className = 'progress-bar';
        const fill = document.createElement('div');
        fill.className = 'progress-fill';
        fill.id = 'fill-' + childIndex;
        fill.style.width = (total ? Math.round(done / total * 100) : 0) + '%';
        bar.appendChild(fill);
        card.appendChild(bar);

        const list = document.createElement('div');
        list.className = 'task-list';

        child.tasks[data.routine].forEach(task => {
          const row = document.createElement('div');
          row.className = 'task' + (task.completed ? ' done' : '');
          row.dataset.taskId = task.id;

          const check = document.createElement('div');
          check.className = 'task-check';
          check.innerHTML = '<svg class="tick" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#FBFAF6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>';

          const text = document.createElement('div');
          text.className = 'task-text';
          text.textContent = task.text;

          const menu = document.createElement('button');
          menu.className = 'task-menu';
          menu.type = 'button';
          menu.textContent = '⋯';
          menu.setAttribute('aria-label', 'Alternativ');
          menu.addEventListener('click', (e) => {
            e.stopPropagation();
            openTaskMenu(childIndex, task.id);
          });

          row.appendChild(check);
          row.appendChild(text);
          row.appendChild(menu);

          row.addEventListener('click', () => {
            task.completed = !task.completed;
            row.classList.toggle('done', task.completed);
            saveData();
            updateCardMeta(childIndex);
            refreshPet(childIndex, true);
          });

          list.appendChild(row);
        });

        card.appendChild(list);
        container.appendChild(card);
        refreshPet(childIndex, false);
      });
    }

    function renderRoutineTabs() {
      const bar = document.getElementById('routine-toggle');
      bar.innerHTML = '';
      data.routines.filter(r => r.active !== false).forEach(r => {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = r.name;
        if (r.id === data.routine) b.classList.add('active');
        b.addEventListener('click', () => switchRoutine(r.id));
        bar.appendChild(b);
      });
    }

    function switchRoutine(routine) {
      data.routine = routine;
      saveData();
      applyThemeForRoutine();
      renderRoutineTabs();
      render();
    }

    document.getElementById('manualResetBtn').addEventListener('click', () => {
      if (!confirm('Vill du återställa rutinen?')) return;
      data.children.forEach(child => child.tasks[data.routine].forEach(t => t.completed = false));
      saveData();
      render();
    });

      },

         "Lägg fram ytterkläder 🥾🧤", "Ta på ytterkläder 🦸🏼"],
        kväll:  ["Läsa läxan 15 minuter 📖", "Packa skolväskan 🎒 (gympa, läxan, utflykt)", "Pyjamas 🩳👕", "Häng upp morgondagens kläder på krok 🪝",

      },

         "Lägg fram ytterkläder 🥾🧤", "Ta på ytterkläder 🦸🏼"],
        kväll:  ["Läsa läxan 15 minuter 📖", "Packa skolväskan 🎒 (gympa, läxan, utflykt)", "Pyjamas 🩳👕", "Häng upp morgondagens kläder på krok 🪝",

      }
    };

    initData();
    checkDailyReset();
    applyThemeForRoutine();
    renderRoutineTabs();
    render();

      pullState();
