<!DOCTYPE html>
<html lang="sv">
<head>

<link rel="apple-touch-icon" sizes="180x180" href="icons/routine-icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#7C8A6B">
<link rel="icon" type="image/png" sizes="32x32" href="icons/routine-icon-32.png">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Rutiner">

  <title>Otis, Loui & Teddys Rutiner</title>

  <style>
    :root {
      --paper: #F4F0E8;
      --card: #FBFAF6;
      --ink: #3A3833;
      --muted: #8C8578;
      --faint: #B7B0A2;
      --line: #E8E2D5;
      --accent: #7C8A6B;
      --accent-hover: #6C7A5C;
      --task-bg: #F6F3EB;
      --task-bg-hover: #F0EBDF;
      --serif: ui-serif, Georgia, "Iowan Old Style", Palatino, serif;
      --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      font-family: var(--sans);
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      transition: background 0.4s ease;
      -webkit-font-smoothing: antialiased;
    }

    header { padding: 18px 16px 4px; }
    .app-bar {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .app-icon {
      width: 30px; height: 30px;
      border-radius: 8px;
      flex-shrink: 0;
      cursor: pointer;
    }
    header h1 {
      margin: 0;
      font-family: var(--serif);
      font-weight: 500;
      font-size: 22px;
      letter-spacing: 0.2px;
    }

    .routine-toggle {
      display: inline-flex;
      background: #E7E1D3;
      border-radius: 999px;
      padding: 3px;
      gap: 2px;
    }
    .routine-toggle button {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 7px 15px;
      border-radius: 999px;
      font-size: 14px;
      cursor: pointer;
      transition: color 0.2s;
    }
    .routine-toggle button.active {
      background: var(--card);
      color: var(--ink);
      box-shadow: 0 1px 2px rgba(0,0,0,0.08);
    }

    #children-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
      max-width: 1100px;
      margin: 18px auto 0;
      padding: 0 16px;
    }

    .child-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px 16px 18px;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .child-card.complete {
      border-color: var(--accent);
      box-shadow: inset 0 0 0 1px var(--accent);
    }

    .child-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
    }
    .child-header h3 {
      margin: 0;
      font-family: var(--serif);
      font-weight: 500;
      font-size: 21px;
    }
    .stars {
      font-size: 14px;
      color: var(--muted);
      white-space: nowrap;
    }

    .progress-bar {
      height: 6px;
      background: #EDE8DC;
      border-radius: 3px;
      overflow: hidden;
      margin: 12px 0 14px;
    }
    .progress-fill {
      height: 100%;
      width: 0;
      background: var(--accent);
      border-radius: 3px;
      transition: width 0.45s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .task-list { display: flex; flex-direction: column; gap: 7px; }

    .task {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 12px;
      border-radius: 12px;
      background: var(--task-bg);
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s, transform 0.1s;
    }
    .task:hover { background: var(--task-bg-hover); }
    .task:active { transform: scale(0.99); }

    .task-check {
      flex: 0 0 auto;
      width: 24px; height: 24px;
      border-radius: 50%;
      border: 2px solid #D3CBB8;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.25s, border-color 0.25s;
    }
    .task-check .tick {
      opacity: 0;
      transform: scale(0.5);
      transition: opacity 0.2s, transform 0.2s;
    }
    .task.done .task-check {
      background: var(--accent);
      border-color: var(--accent);
      animation: checkPop 0.3s ease;
    }
    .task.done .task-check .tick { opacity: 1; transform: scale(1); }
    @keyframes checkPop {
      0% { transform: scale(1); }
      40% { transform: scale(1.18); }
      100% { transform: scale(1); }
    }

    .task-text {
      flex: 1;
      font-size: 15px;
      line-height: 1.3;
    }
    .task.done .task-text {
      color: var(--faint);
      text-decoration: line-through;
    }

    .task-menu {
      flex: 0 0 auto;
      background: transparent;
      border: 0;
      color: #CBC3B1;
      font-size: 20px;
      line-height: 1;
      padding: 2px 6px;
      border-radius: 6px;
      cursor: pointer;
    }
    .task-menu:hover { color: var(--muted); background: #ECE7DB; }

    .pet-scene {
      position: relative;
      height: 168px;
      margin: 0 0 12px;
      border-radius: 12px;
      overflow: hidden;
    }
    .pet-canvas {
      position: absolute; inset: 0; z-index: 0;
      width: 100%; height: 100%; display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .world-swap {
      position: absolute; top: 8px; right: 8px; z-index: 2;
      width: 30px; height: 30px; border-radius: 50%; padding: 0;
      border: 0; background: rgba(255,255,255,0.32); color: #fff;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
    }
    .world-swap:hover { background: rgba(255,255,255,0.5); }

    .admin {
      width: min(560px, 94vw);
      max-height: 88vh;
      overflow-y: auto;
      background: var(--card);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 12px 34px rgba(0,0,0,0.22);
      text-align: left;
    }
    .admin-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .admin-x { background: transparent; border: 0; font-size: 16px; color: var(--muted); cursor: pointer; }
    .admin-label { font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--faint); margin: 4px 0 8px; }
    .admin-lists { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    .admin-chip { border: 1px solid var(--line); background: #F3EFE7; color: var(--ink); border-radius: 999px; padding: 7px 14px; font-size: 14px; cursor: pointer; }
    .admin-chip.active { background: var(--accent); color: #FBFAF6; border-color: var(--accent); }
    .admin-chip.add { border-style: dashed; color: var(--muted); background: transparent; }
    .admin-chip.inactive { opacity: 0.45; }
    .admin-chip.inactive.active { opacity: 0.7; }
    .admin-listbar { display: flex; gap: 8px; margin-bottom: 16px; }
    .admin-mini { background: transparent; border: 1px solid var(--line); color: var(--muted); border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
    .admin-mini.danger { color: #B4614E; border-color: #E4C3BB; }
    .admin-tasks { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
    .admin-task { display: flex; align-items: center; gap: 8px; }
    .admin-task-text { flex: 1; min-width: 0; padding: 9px 10px; border: 1px solid var(--line); border-radius: 10px; font-size: 15px; font-family: var(--sans); color: var(--ink); background: #fff; }
    .admin-who { display: flex; gap: 5px; flex-shrink: 0; }
    .admin-pill { border: 1px solid var(--line); background: #F3EFE7; color: var(--muted); border-radius: 999px; padding: 5px 9px; font-size: 12px; cursor: pointer; }
    .admin-pill.on { background: var(--accent); color: #FBFAF6; border-color: var(--accent); }
    .admin-del { background: transparent; border: 0; color: #C3382A; font-size: 14px; cursor: pointer; padding: 4px 6px; flex-shrink: 0; }
    .admin-empty { color: var(--muted); font-size: 14px; padding: 8px 2px; }
    .admin-add { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; border-top: 1px solid var(--line); padding-top: 14px; }
    .admin-add input { flex: 1 1 160px; min-width: 0; padding: 10px; border: 1px solid var(--line); border-radius: 10px; font-size: 15px; font-family: var(--sans); color: var(--ink); background: #fff; }
    .admin-add-who { display: flex; gap: 5px; }
    .admin-add-btn { background: var(--accent); color: #FBFAF6; border: 0; border-radius: 10px; padding: 10px 16px; font-size: 14px; cursor: pointer; }

    .reset-container { text-align: center; margin: 22px 0 28px; }
    #manualResetBtn {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--muted);
      border-radius: 999px;
      padding: 9px 20px;
      font-size: 14px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }
    #manualResetBtn:hover { border-color: var(--faint); color: var(--ink); }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(45, 43, 38, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    .hidden { display: none; }
    .modal {
      width: min(340px, 90vw);
      background: var(--card);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 12px 34px rgba(0,0,0,0.22);
      text-align: left;
    }
    .modal-title { font-family: var(--serif); font-size: 17px; margin-bottom: 12px; }
    .modal-actions { display: flex; gap: 10px; justify-content: space-between; }
    .modal-btn {
      flex: 1;
      padding: 10px 12px;
      border-radius: 12px;
      border: none;
      background: var(--accent);
      color: #FBFAF6;
      cursor: pointer;
      font-size: 15px;
    }
    .modal-btn:hover { background: var(--accent-hover); }
    .modal-btn.secondary { background: #9C978A; }
    .modal-btn.danger { background: #B4614E; }
    .modal label { font-size: 14px; color: var(--muted); }
    .modal select, .modal input {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--line);
      font-size: 16px;
      margin-top: 4px;
      font-family: var(--sans);
      color: var(--ink);
      background: #fff;
    }
  </style>
</head>

<body>
  <header>
    <div class="app-bar">
      <div class="brand">
        <img src="icons/routine-icon-180.png" alt="" class="app-icon">
        <h1>Rutiner</h1>
      </div>
      <div class="routine-toggle" id="routine-toggle"></div>
    </div>
  </header>

  <div id="children-container"></div>

  <div class="reset-container">
    <button id="manualResetBtn">Återställ</button>
  </div>

  <div id="taskMenuOverlay" class="overlay hidden">
    <div class="modal">
      <div class="modal-title">Välj</div>
      <div class="modal-actions">
        <button id="taskMenuEditBtn" class="modal-btn">Redigera</button>
        <button id="taskMenuDeleteBtn" class="modal-btn danger">Ta bort</button>
        <button id="taskMenuCancelBtn" class="modal-btn secondary">Avbryt</button>
      </div>
    </div>
  </div>

  <div id="adminOverlay" class="overlay hidden">
    <div class="admin">
      <div class="admin-head">
        <div class="modal-title">Admin</div>
        <button id="adminCloseBtn" class="admin-x" type="button" aria-label="Stäng">✕</button>
      </div>
      <div class="admin-label">Listor</div>
      <div class="admin-lists" id="adminLists"></div>
      <div class="admin-listbar">
        <button id="adminToggleActiveBtn" class="admin-mini" type="button">Dölj lista</button>
        <button id="adminRenameBtn" class="admin-mini" type="button">Byt namn</button>
        <button id="adminDeleteListBtn" class="admin-mini danger" type="button">Ta bort lista</button>
      </div>
      <div class="admin-label">Uppgifter</div>
      <div class="admin-tasks" id="adminTasks"></div>
      <div class="admin-add">
        <input id="adminNewTask" type="text" placeholder="Ny uppgift…">
        <div class="admin-add-who" id="adminNewWho"></div>
        <button id="adminAddBtn" class="admin-add-btn" type="button">Lägg till</button>
      </div>
    </div>
  </div>

  <!-- Supabase (loaded but dormant until CLOUD_SYNC is turned on) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const STORAGE_KEY = 'routineData_v2';
    const defaultChildren = ['Teddy', 'Otis', 'Loui'];
    let data;

    // ===== Supabase sync (shared Familje-Mello project) =====
    // Cross-device sync. If the (free) project auto-pauses or is unreachable,
    // the app silently falls back to localStorage and re-syncs when it returns.
    const CLOUD_SYNC = true;
    const SUPABASE_URL = 'https://bhurxoknmyfqymtiaycx.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJodXJ4b2tubXlmcXltdGlheWN4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5NzI5NTAsImV4cCI6MjA5NzU0ODk1MH0.YbblDF0jfZNzdIMy8rMF3t19b7b6onD91VVLi9N8kYg';
    const HOUSEHOLD_ID = 'c16b0799-e72b-4318-99e1-12661b9f6e02';

    const CLIENT_ID = 'c_' + Math.random().toString(36).slice(2, 10);
    let sb = null;
    let applyingRemote = false;
    let pushTimer = null;
    // Held true until the first cloud pull resolves, so a freshly-seeded device
    // can never push its default state before it has had a chance to adopt the
    // real household data. Prevents a new/cleared device from clobbering the cloud.
    let firstSyncDone = false;

    function syncEnabled() {
      return CLOUD_SYNC && !!sb && HOUSEHOLD_ID && HOUSEHOLD_ID.indexOf('__') !== 0;
    }

    function initSupabase() {
      try {
        if (!CLOUD_SYNC) return;
        if (!HOUSEHOLD_ID || HOUSEHOLD_ID.indexOf('__') === 0) return;
        if (window.supabase && window.supabase.createClient) {
          sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }
      } catch (e) { console.warn('Supabase init failed', e); }
    }

    function routineIds() { return data.routines.map(r => r.id); }
    function routineName(id) { const r = data.routines.find(x => x.id === id); return r ? r.name : id; }

    function normalizeData() {
      if (!data || !Array.isArray(data.children)) return;
      if (!Array.isArray(data.routines) || !data.routines.length) {
        data.routines = [{ id: 'morgon', name: 'Morgon' }, { id: 'kväll', name: 'Kväll' }, { id: 'helg', name: 'Helg' }];
      }
      const ids = data.routines.map(r => r.id);
      if (!data.routine || ids.indexOf(data.routine) < 0) data.routine = ids[0];
      data.routines.forEach(r => { if (r.active === undefined) r.active = true; });
      const activeIds = data.routines.filter(r => r.active !== false).map(r => r.id);
      if (activeIds.length && activeIds.indexOf(data.routine) < 0) data.routine = activeIds[0];
      data.children.forEach((ch, idx) => {
        if (!ch.world) ch.world = ['city', 'jungle', 'space'][idx % 3];
        if (!ch.species) ch.species = ['kanin', 'rav', 'uggla'][idx % 3];
        if (!ch.tasks) ch.tasks = {};
        ids.forEach(r => { if (!Array.isArray(ch.tasks[r])) ch.tasks[r] = []; });
      });
      // Ensure ids + shared group-ids (identical text in a list shares one gid)
      ids.forEach(listId => {
        const textGid = {};
        data.children.forEach(ch => {
          ch.tasks[listId].forEach(t => {
            if (!t.id) t.id = makeId();
            if (t.gid) textGid[t.text] = t.gid;
            else { if (!textGid[t.text]) textGid[t.text] = 'g_' + makeId(); t.gid = textGid[t.text]; }
          });
        });
      });
      return;
      // legacy loop retained below (unreachable)
      data.children.forEach((ch) => {
        ['morgon', 'kväll', 'helg'].forEach(r => {
          if (!ch.tasks[r]) ch.tasks[r] = [];
          ch.tasks[r].forEach(t => { if (!t.id) t.id = makeId(); });
        });
      });
    }

    function schedulePush() {
      if (!syncEnabled() || applyingRemote || !firstSyncDone) return;
      clearTimeout(pushTimer);
      pushTimer = setTimeout(pushState, 400);
    }
    async function pushState() {
      if (!syncEnabled()) return;
      try {
        const payload = Object.assign({}, data, { _src: CLIENT_ID });
        await sb.from('households').update({ state: payload, updated_at: new Date().toISOString() }).eq('id', HOUSEHOLD_ID);
      } catch (e) { console.warn('Push failed', e); }
    }
    async function pullState() {
      if (!syncEnabled()) { firstSyncDone = true; return; }
      try {
        const { data: row, error } = await sb.from('households').select('state').eq('id', HOUSEHOLD_ID).single();
        if (error) throw error;
        const remote = row && row.state;
        if (remote && Array.isArray(remote.children) && remote.children.length) {
          if (remote._src === CLIENT_ID) return;
          // A freshly-seeded device (empty localStorage → default lists) must NEVER
          // overwrite a populated cloud. Always adopt the real household data instead.
          if (data._seeded) adoptRemote(remote);
          else if (remoteIsNewer(remote)) adoptRemote(remote);
          else pushState();
        } else {
          // Cloud is empty: only seed it from a device that actually holds real data,
          // never from a fresh default seed (which would just plant defaults).
          if (!data._seeded) pushState();
        }
      } catch (e) { console.warn('Pull failed', e); }
      finally { firstSyncDone = true; }
    }
    function adoptRemote(remote) {
      applyingRemote = true;
      data = remote;
      data._seeded = false;
      normalizeData();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      applyingRemote = false;
      applyThemeForRoutine();
      renderRoutineTabs();
      render();
    }
    function subscribeRealtime() {
      if (!syncEnabled()) return;
      sb.channel('household-' + HOUSEHOLD_ID)
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'households', filter: 'id=eq.' + HOUSEHOLD_ID },
          (payload) => {
            const remote = payload.new && payload.new.state;
            if (!remote || remote._src === CLIENT_ID) return;
            if (remoteIsNewer(remote)) adoptRemote(remote);
          })
        .subscribe();
    }

    function todayStockholm() {
      return new Date().toLocaleDateString('sv-SE', { timeZone: 'Europe/Stockholm' });
    }
    // ===== end Supabase sync =====

    // ===== Task menu (edit / delete) =====
    let taskMenuState = null;
    function openTaskMenu(childIndex, taskId) {
      taskMenuState = { childIndex, taskId };
      document.getElementById('taskMenuOverlay').classList.remove('hidden');
    }
    function closeTaskMenu() {
      taskMenuState = null;
      document.getElementById('taskMenuOverlay').classList.add('hidden');
    }
    const overlayEl = document.getElementById('taskMenuOverlay');
    document.getElementById('taskMenuCancelBtn').addEventListener('click', closeTaskMenu);
    overlayEl.addEventListener('click', (e) => { if (e.target === overlayEl) closeTaskMenu(); });

    document.getElementById('taskMenuDeleteBtn').addEventListener('click', () => {
      if (!taskMenuState) return;
      if (!window.confirm('Ta bort?')) return;
      const { childIndex, taskId } = taskMenuState;
      const arr = data.children[childIndex].tasks[data.routine];
      const idx = arr.findIndex(t => t.id === taskId);
      if (idx >= 0) arr.splice(idx, 1);
      saveData();
      closeTaskMenu();
      render();
    });

    document.getElementById('taskMenuEditBtn').addEventListener('click', () => {
      if (!taskMenuState) return;
      const { childIndex, taskId } = taskMenuState;
      const arr = data.children[childIndex].tasks[data.routine];
      const task = arr.find(t => t.id === taskId);
      if (!task) { closeTaskMenu(); return; }
      const newText = window.prompt('Redigera uppgift:', task.text);
      if (newText === null) return;
      const trimmed = newText.trim();
      if (!trimmed) return;
      task.text = trimmed;
      saveData();
      closeTaskMenu();
      render();
    });

    // ===== Hidden parent mode: tap app icon 7 times =====
    let secretTaps = 0;
    let secretTimer = null;

    let adminListId = null;

    function openAdmin() {
      adminListId = data.routine;
      document.getElementById('adminOverlay').classList.remove('hidden');
      renderAdmin();
    }
    function closeAdmin() {
      document.getElementById('adminOverlay').classList.add('hidden');
      applyThemeForRoutine();
      renderRoutineTabs();
      render();
    }
    const adminOverlayEl = document.getElementById('adminOverlay');
    adminOverlayEl.addEventListener('click', (e) => { if (e.target === adminOverlayEl) closeAdmin(); });
    document.getElementById('adminCloseBtn').addEventListener('click', closeAdmin);

    // Group each list's per-child tasks by shared gid into one editable row.
    function taskGroups(listId) {
      const groups = []; const byGid = {};
      data.children.forEach(ch => (ch.tasks[listId] || []).forEach(t => {
        let g = byGid[t.gid];
        if (!g) { g = { gid: t.gid, text: t.text, members: {} }; byGid[t.gid] = g; groups.push(g); }
        g.members[ch.name] = t.id;
      }));
      return groups;
    }
    function toggleAssign(listId, g, childName) {
      const ch = data.children.find(c => c.name === childName);
      if (!ch) return;
      const arr = ch.tasks[listId] || (ch.tasks[listId] = []);
      const idx = arr.findIndex(t => t.gid === g.gid);
      if (idx >= 0) arr.splice(idx, 1);
      else arr.push({ id: makeId(), gid: g.gid, text: g.text, completed: false });
      saveData();
    }

    function renderAdmin() {
      if (routineIds().indexOf(adminListId) < 0) adminListId = data.routine;

      const listsEl = document.getElementById('adminLists');
      listsEl.innerHTML = '';
      data.routines.forEach(r => {
        const b = document.createElement('button');
        b.className = 'admin-chip' + (r.id === adminListId ? ' active' : '') + (r.active === false ? ' inactive' : '');

    // ===== Themes (muted per routine) =====
    const THEMES = {
      morgon: { '--paper': '#F4F0E8', '--accent': '#7C8A6B', '--accent-hover': '#6C7A5C' },
      kväll:  { '--paper': '#ECEAF1', '--accent': '#6E6690', '--accent-hover': '#5C5580' },
      helg:   { '--paper': '#F5EFE4', '--accent': '#5E8A82', '--accent-hover': '#4E7A72' }
    };
    const DEFAULT_THEMES = [
      { '--paper': '#EFEDE6', '--accent': '#8A7E6A', '--accent-hover': '#786D5B' },
      { '--paper': '#EAF0EE', '--accent': '#5E8A82', '--accent-hover': '#4E7A72' },
      { '--paper': '#F1ECE4', '--accent': '#9A7B6A', '--accent-hover': '#87695A' },
      { '--paper': '#EDEFEA', '--accent': '#78896B', '--accent-hover': '#67785B' }
    ];
    function applyThemeForRoutine() {
      let theme = THEMES[data.routine];
      if (!theme) {
        const idx = Math.max(0, routineIds().indexOf(data.routine));
        theme = DEFAULT_THEMES[idx % DEFAULT_THEMES.length];
      }
      const root = document.documentElement;
      Object.entries(theme).forEach(([k, v]) => root.style.setProperty(k, v));

    function makeId() {
      return 't_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
    }

    function initData() {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored) {
        data = JSON.parse(stored);
        normalizeData();
        persist();
        return;
      }
      // No stored data: build a default seed. Mark it as a seed so the first cloud
      // pull adopts the real household instead of pushing these defaults over it.
      data = {
        routine: 'morgon',
        lastReset: null,
        _seeded: true,
        routines: [{ id: 'morgon', name: 'Morgon' }, { id: 'kväll', name: 'Kväll' }, { id: 'helg', name: 'Helg' }],
        children: defaultChildren.map((name, idx) => ({ name, world: ['city', 'jungle', 'space'][idx % 3], species: ['kanin', 'rav', 'uggla'][idx % 3], tasks: { morgon: [], kväll: [], helg: [] } }))
      };
      data.children.forEach(child => {
        const preset = STARTER_TASKS[child.name];
        if (!preset) return;
        ['morgon', 'kväll', 'helg'].forEach(r => {
          (preset[r] || []).forEach(text => {
            child.tasks[r].push({ id: makeId(), text, completed: false });
          });
        });
      });
      normalizeData();
      persist();
    }

    // Local-only persist: no timestamp bump, no cloud push. Used during boot/migration
    // and daily reset so opening the app never re-stamps or pushes unchanged state.
    function persist() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }
    // Genuine user edit: this device now holds real (non-seed) data, so stamp the
    // time, drop the seed flag, and sync it out.
    function saveData() {
      if (!applyingRemote) {
        data.updatedAt = new Date().toISOString();
        // Keep the seed flag until the first cloud pull has resolved, so an early
        // tap on a still-seeded device can't turn it into a cloud-clobbering push.
        if (firstSyncDone) data._seeded = false;
      }
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      schedulePush();
    }
    function remoteIsNewer(remote) {
      return (remote.updatedAt || '') > (data.updatedAt || '');
    }

    // Clear yesterday's checks on the first open of a new day.
    // A fresh seed just records the date locally (persist) so it keeps its seed flag
    // until the cloud pull; a real reset on real data stamps + syncs as before.
    function checkDailyReset() {
      const today = todayStockholm();
      const saveReset = () => { data._seeded ? persist() : saveData(); };
      if (!data.lastReset) { data.lastReset = today; saveReset(); return; }
      if (data.lastReset !== today) {
        data.children.forEach(ch => {
          routineIds().forEach(r => (ch.tasks[r] || []).forEach(t => t.completed = false));
        });
        data.lastReset = today;
        saveReset();
      }
    }

    function doneCount(child) {
      return child.tasks[data.routine].filter(t => t.completed).length;
    }

    // ===== Pixel-art pet engine (ported from sprite-lab) =====
    const R = 2;
    const CREW = 108, CREH = 104, ccx = 54, cgy = 92;

    const PALS = {
      kanin: { out:'#3B302A', body:'#C7AC88', light:'#DCC4A0', dark:'#AE926B', belly:'#ECDDC4', ear:'#DBA791', eye:'#2E2723', cheek:'#E0A187', foot:'#AE926B' },
      rav:   { out:'#3A2A1E', body:'#C67C43', light:'#DB9354', dark:'#A9622C', belly:'#F1E7D8', ear:'#3A2A1E', eye:'#2A211A', cheek:'#E7A06E', foot:'#3A2A1E', tailtip:'#F1E7D8' },
      uggla: { out:'#2E2A24', body:'#9A8468', light:'#B29A7A', dark:'#7E6A50', belly:'#E6DAC4', ear:'#7E6A50', eye:'#2A2620', cheek:'#C79A6E', foot:'#C9992E', beak:'#D98A3C' }
    };
    const STEEL = {fill:'#C6CCD3',shine:'#ECF0F4',out:'#474C54'}, GOLD='#CBA23E', GRIP='#6B4A32';
    const WOOD='#8A6A46', WOODD='#5F4A30', CRYSTAL='#7FC8D6', CRYSTALL='#D6F4FA', CRYSTAL_D='#4E9AA8';
    const SCARF = {fill:'#A6442F',dark:'#7C3020'}, CAPE={fill:'#8E3B34',dark:'#5E2620',clasp:'#E0C877'};
    const HORN='#E6D8BB', HORN_D='#BCA97F';
    const SHIELD = {face:'#7E5A3A',rim:'#CBA23E',boss:'#E4D08A',dark:'#5A3F28'};
    const JET = {metal:'#9AA0A6',dark:'#61666B'}, FIRE=['#F3C86A','#E88C36','#D9542E'];

    const STAGES = [
      { key:'cub',   sc:0.62, earScale:0.7,  att:false },
      { key:'child', sc:0.88, earScale:1.0,  att:false },
      { key:'adult', sc:1.10, earScale:1.15, att:true  }
    ];

    function inEll(x,y,cx,cy,rx,ry){ const dx=(x+0.5-cx)/rx,dy=(y+0.5-cy)/ry; return dx*dx+dy*dy<=1; }
    function inTri(x,y,ax,ay,w,by){ if(y<ay||y>by)return false; const t=(y-ay)/(by-ay); return Math.abs(x+0.5-ax)<=w*t; }
    function segDist(px,py,x1,y1,x2,y2){ const vx=x2-x1,vy=y2-y1,wx=px+0.5-x1,wy=py+0.5-y1; const c2=vx*vx+vy*vy; let t=c2?(vx*wx+vy*wy)/c2:0; t=Math.max(0,Math.min(1,t)); const dx=x1+t*vx-(px+0.5),dy=y1+t*vy-(py+0.5); return Math.hypot(dx,dy); }

    function build(species,st,o){
      const P=PALS[species], sx=o.sx||1, sy=o.sy||1, k=st.sc*R, att=st.att, ek=st.earScale;
      const rr=(n)=>Math.round(n*R);
      const g=[]; for(let y=0;y<CREH;y++) g.push(new Array(CREW).fill(null));
      const set=(x,y,c)=>{ if(y>=0&&y<CREH&&x>=0&&x<CREW)g[y][x]=c; };
      const setIf=(x,y,c)=>{ if(y>=0&&y<CREH&&x>=0&&x<CREW&&g[y][x])g[y][x]=c; };

      const cx=ccx, groundY=cgy;
      const bodyRx=10*k*sx, bodyRy=10.5*k*sy, bodyCy=groundY-bodyRy;
      const bodyBottom=Math.round(bodyCy+bodyRy);
      const earRx=3*k*ek, earRy=6*k*ek*sy, earCy=bodyCy-9.5*k*sy;
      const earLcx=Math.round(cx-5.4*k), earRcx=Math.round(cx+5.4*k);
      const isFox=species==='rav', isOwl=species==='uggla';

      const topP={x:cx-bodyRx*0.72,y:bodyCy-bodyRy*0.5}, botP={x:cx+bodyRx*1.30,y:bodyCy+bodyRy*0.92};
      const dlen=Math.hypot(botP.x-topP.x,botP.y-topP.y), dx=(botP.x-topP.x)/dlen, dy=(botP.y-topP.y)/dlen;
      const gLen=(o.gadget==='hammer'||o.gadget==='staff')?9:11;
      const gEnd={x:topP.x-dx*gLen*k,y:topP.y-dy*gLen*k}; const px=-dy,py=dx;

      function backLine(colFn,halfMax,taper){
        for(let y=0;y<CREH;y++) for(let x=0;x<CREW;x++){
          const rx=x+0.5-topP.x, ry=y+0.5-topP.y, along=(rx*dx+ry*dy)/dlen;
          if(along<0||along>1.02) continue;
          const s=rx*(-dy)+ry*dx, perp=Math.abs(s);
          let hh=halfMax; if(taper&&along>0.84) hh=halfMax*(1-(along-0.84)/0.18); if(hh<0)hh=0;
          if(perp<=hh) g[y][x]=colFn(s,along);
          else if(perp<=hh+1&&along<1.0) g[y][x]=STEEL.out;
        }
      }
      if(o.gadget==='sword'){
        backLine((s)=>s<0?STEEL.shine:STEEL.fill,1.95*k,true);
        for(let y=0;y<CREH;y++) for(let x=0;x<CREW;x++){ if(segDist(x,y,topP.x,topP.y,gEnd.x,gEnd.y)<=1.8*k) g[y][x]=P.out; }
        for(let y=0;y<CREH;y++) for(let x=0;x<CREW;x++){ if(segDist(x,y,topP.x,topP.y,gEnd.x,gEnd.y)<=1.05*k) g[y][x]=GRIP; }
        const g1={x:topP.x+px*3.4*k,y:topP.y+py*3.4*k}, g2={x:topP.x-px*3.4*k,y:topP.y-py*3.4*k};
        for(let y=0;y<CREH;y++) for(let x=0;x<CREW;x++){ if(segDist(x,y,g1.x,g1.y,g2.x,g2.y)<=1.5*k) g[y][x]=P.out; }
        for(let y=0;y<CREH;y++) for(let x=0;x<CREW;x++){ if(segDist(x,y,g1.x,g1.y,g2.x,g2.y)<=0.9*k) g[y][x]=GOLD; }
        const gr={x:Math.round(gEnd.x),y:Math.round(gEnd.y)}; for(let yy=-2;yy<=2;yy++) for(let xx=-2;xx<=2;xx++){ if(xx*xx+yy*yy<=4) set(gr.x+xx,gr.y+yy,(xx*xx+yy*yy<=1)?GOLD:P.out); }
      }
      if(o.gadget==='hammer'){
        for(let y=0;y<CREH;y++) for(let x=0;x<CREW;x++){ const d=segDist(x,y,gEnd.x,gEnd.y,botP.x,botP.y); if(d<=1.9*k) g[y][x]=WOOD; else if(d<=1.9*k+1) g[y][x]=WOODD; }
        const hcx=gEnd.x-dx*3*k, hcy=gEnd.y-dy*3*k, HW=6.5*k, HH=4.6*k;
        for(let y=0;y<CREH;y++) for(let x=0;x<CREW;x++){ const ax=(x+0.5-hcx)*dx+(y+0.5-hcy)*dy, ac=(x+0.5-hcx)*px+(y+0.5-hcy)*py; if(Math.abs(ax)<=HH && Math.abs(ac)<=HW) set(x,y,(Math.abs(ax)>HH-1||Math.abs(ac)>HW-1)?STEEL.out:(ac<0?STEEL.shine:STEEL.fill)); }
      }
      if(o.gadget==='staff'){
        for(let y=0;y<CREH;y++) for(let x=0;x<CREW;x++){ const d=segDist(x,y,gEnd.x,gEnd.y,botP.x,botP.y); if(d<=1.3*k) g[y][x]=WOOD; else if(d<=1.3*k+1) g[y][x]=WOODD; }
        const ox=gEnd.x-dx*4*k, oy=gEnd.y-dy*4*k, r=6*k, pulse=(Math.sin((o.frame||0)/8)+1)/2;
        for(let y=0;y<CREH;y++) for(let x=0;x<CREW;x++){
          if(inEll(x,y,ox,oy,r,r)){ let c=CRYSTAL; if(inEll(x,y,ox-r*0.28,oy-r*0.28,r*0.5,r*0.5)) c=CRYSTALL; if(!inEll(x,y,ox,oy,r-1,r-1)) c=CRYSTAL_D; set(x,y,c); }
          else if(pulse>0.55 && inEll(x,y,ox,oy,r+1.6,r+1.6)) set(x,y,CRYSTAL);
        }
      }
      if(o.gadget==='cape'){
        const topY=bodyCy-bodyRy*0.35, botY=bodyCy+bodyRy*1.18, topH=bodyRx*0.5, botH=bodyRx*1.18;
        for(let y=Math.floor(topY);y<=Math.ceil(botY+2);y++){ const tt=(y-topY)/(botY-topY); if(tt<0)continue; const hw=topH+(botH-topH)*Math.min(1,tt);
          for(let x=0;x<CREW;x++){ const rel=x+0.5-cx; const bh=botY+Math.sin(x*0.55+(o.frame||0)/9)*1.7*Math.min(1,tt); if(y<=bh&&Math.abs(rel)<=hw) g[y][x]=(Math.abs(rel)>hw-1.1||y>bh-1.1)?CAPE.dark:CAPE.fill; } }
      }
      if(o.gadget==='jetpack'){
        for(const sgn of [-1,1]){ const jx=cx+sgn*bodyRx*0.82; for(let y=Math.round(bodyCy-2);y<=Math.round(bodyCy+bodyRy*0.7);y++) for(let x=Math.round(jx-2);x<=Math.round(jx+2);x++){ if(inEll(x,y,jx,bodyCy+bodyRy*0.35,2.4,bodyRy*0.55)) set(x,y, (x<jx-1||x>jx+1)?JET.dark:JET.metal); }
          const fy=Math.round(bodyCy+bodyRy*0.9); for(let i=0;i<3;i++){ const c=FIRE[i]; set(Math.round(jx),fy+i,c); if(i<2){set(Math.round(jx)-1,fy+i,c);set(Math.round(jx)+1,fy+i,c);} }
        }
      }

      if(isFox){
        const tx=cx+bodyRx*0.78, ty=bodyCy+bodyRy*0.30;
        const tSolid=(x,y)=>inEll(x,y,tx+rr(2),ty,5.6*k,3.9*k)||inEll(x,y,tx+rr(6),ty-rr(2),4.5*k,3.3*k)||inEll(x,y,tx+rr(10),ty-rr(4),3.5*k,2.7*k);
        for(let y=0;y<CREH;y++) for(let x=0;x<CREW;x++){ if(!tSolid(x,y)) continue;
          const border=!tSolid(x-1,y)||!tSolid(x+1,y)||!tSolid(x,y-1)||!tSolid(x,y+1);
          setOrPlace(g,x,y, border?P.out : (inEll(x,y,tx+rr(10),ty-rr(4),3.1*k,2.4*k)?P.tailtip:P.body)); }
      }

      function ear(x,y,ex){ if(isOwl) return false; if(isFox) return inTri(x,y,ex,earCy-earRy,3.9*k*ek,earCy+earRy*0.4); return inEll(x,y,ex,earCy,earRx,earRy); }
      function solid(x,y){ return inEll(x,y,cx,bodyCy,bodyRx,bodyRy)||ear(x,y,earLcx)||ear(x,y,earRcx); }
      for(let y=0;y<CREH;y++) for(let x=0;x<CREW;x++){
        if(!solid(x,y)) continue;
        if(!solid(x-1,y)||!solid(x+1,y)||!solid(x,y-1)||!solid(x,y+1)){ g[y][x]=P.out; continue; }
        let col=P.body;
        if(!isFox && (inEll(x,y,earLcx,earCy+1,1.3*k,2.6*k)||inEll(x,y,earRcx,earCy+1,1.3*k,2.6*k))) col=P.ear;
        else if(isFox && (inTri(x,y,earLcx,earCy-earRy,2.2*k*ek,earCy-earRy*0.35)||inTri(x,y,earRcx,earCy-earRy,2.2*k*ek,earCy-earRy*0.35))) col=P.ear;
        else if(inEll(x,y,cx,bodyCy+3*R*sy,5.6*k,6.2*k*sy)) col=P.belly;
        else { const core=inEll(x,y,cx-bodyRx*0.16,bodyCy-bodyRy*0.14,bodyRx*0.72,bodyRy*0.74);
          if(!core){ const dd=(x+0.5-cx)+(y+0.5-bodyCy); if(dd>bodyRx*0.42) col=P.dark; else if(dd<-bodyRx*0.75) col=P.light; } }
        g[y][x]=col;
      }

      function foot(fx,off){ const w=rr(3); for(let x=fx;x<fx+w;x++) for(let y=bodyBottom-rr(1)-off;y<=bodyBottom+rr(1)-off;y++){ if(y===bodyBottom+rr(1)-off||x===fx||x===fx+w-1) set(x,y,P.out); else set(x,y,P.foot);} }
      foot(cx-Math.round(7*k),(o.footL||0)*R); foot(cx+Math.round(4*k),(o.footR||0)*R);

      const eyeCy=Math.round(bodyCy+(st.key==='cub'?rr(1):0));
      const eyeLx=Math.round(cx-4.2*R), eyeRx=Math.round(cx+4.2*R);

        else { setIf(cx-e,m,P.out); setIf(cx-Math.round(e*0.5),m+1,P.out); setIf(cx,m+1,P.out); setIf(cx+Math.round(e*0.5),m+1,P.out); setIf(cx+e,m,P.out); } }

      if(att && !isOwl){
        for(const sgn of [-1,1]){ const hx=cx+sgn*rr(3), len=Math.round(5*R); for(let i=0;i<len;i++){ const hy=Math.round(earCy+rr(2)-i*1.3), hxx=hx+sgn*Math.round(i*0.55); set(hxx,hy,HORN); set(hxx+sgn,hy,HORN_D); set(hxx,hy+1,HORN_D);} }
      }
      if(att){
        for(const sgn of [-1,1]){ const bx=cx+sgn*Math.round(bodyRx*0.92); set(bx,Math.round(bodyCy-rr(1)),P.dark); set(bx+sgn,Math.round(bodyCy-rr(2)),P.dark); set(bx+sgn*rr(2),Math.round(bodyCy),P.dark);} }

      if(att){
        const ny=Math.round(bodyCy+bodyRy*0.42), th=rr(2);

        const fl=Math.round(Math.sin((o.frame||0)/12)*R); const txp=cx-Math.round(bodyRx*0.8);
        for(let i=0;i<rr(4);i++){ set(txp-rr(1)-i,ny+th+i+fl,i<rr(3)?SCARF.fill:SCARF.dark); set(txp-rr(1)-i,ny+th+1+i+fl,SCARF.dark); }

      function setOrPlace(gr,x,y,c){ if(y>=0&&y<CREH&&x>=0&&x<CREW) gr[y][x]=c; }

      if(isOwl){
        for(const sgn of [-1,1]){ const wx=cx+sgn*bodyRx*0.72; for(let y=0;y<CREH;y++) for(let x=0;x<CREW;x++){ if(inEll(x,y,wx,bodyCy+bodyRy*0.15,2.6*k,bodyRy*0.72)){ setIf(x,y, (Math.abs(x+0.5-wx)>1.6*k)?P.out:P.dark);} } }
        for(const sgn of [-1,1]){ const tx=cx+sgn*4; for(let i=0;i<3;i++){ set(tx+sgn*i,Math.round(bodyCy-bodyRy+2-i),P.dark);} }

      if(o.gadget==='cape'){ const ny=Math.round(bodyCy+bodyRy*0.28); setIf(cx-1,ny,CAPE.dark); setIf(cx,ny,CAPE.clasp); setIf(cx+1,ny,CAPE.dark); }
      if(o.gadget==='shield'){

          for(let j=0;j<bolt.length-1;j++){ let x1=ox+sgn*bolt[j][0]*R*0.7, y1=oy+bolt[j][1]*R*0.7, x2=ox+sgn*bolt[j+1][0]*R*0.7, y2=oy+bolt[j+1][1]*R*0.7, steps=Math.round(Math.hypot(x2-x1,y2-y1)); for(let s=0;s<=steps;s++){ set(Math.round(x1+(x2-x1)*s/steps),Math.round(y1+(y2-y1)*s/steps), s%3?'#F0C64B':'#FBE7A0'); } } }

    // ---- daily gadget pool + deterministic pick ----
    const GADGET_POOL = ['sword','hammer','staff','shield','jetpack','cape','magic','electricity','drone','dog','rc'];
    function petHash(str){ let h=1779033703^str.length; for(let i=0;i<str.length;i++){ h=Math.imul(h^str.charCodeAt(i),3432918353); h=h<<13|h>>>19; } return h>>>0; }

    function dailyGadget(name){
      const rnd=mulberry32(petHash(name+'|'+todayStockholm()));
      return GADGET_POOL[Math.floor(rnd()*GADGET_POOL.length)];
    }

    // ===== Pixel worlds (muted backdrops + one raised ledge each) =====
    const WORLDS = ['city', 'jungle', 'space'];
    // Low-res scene buffer size (drawn scaled up onto the visible canvas).
    const SCENE_W = 150, SCENE_H = 84, GROUND_Y = 74;
    // Dense floating platforms (shared layout, styled per world). Heights/spacing
    // tuned so a jump (reach ~20px) climbs exactly one level; ~18px gaps let the
    // pet fall a level when it steps off an edge. Levels overlap in x so 1->2->3
    // is climbable.
    const PLATFORMS = [
      { x0:18, x1:44,  top:58 }, { x0:62, x1:88,  top:58 }, { x0:106, x1:132, top:58 }, // level 1
      { x0:30, x1:56,  top:42 }, { x0:84, x1:110, top:42 },                             // level 2
      { x0:40, x1:64,  top:27 }                                                          // level 3
    ];
    const PLAT_STYLE = {
      city:   { face:'#3F4260', top:'#5C6088', edge:'#2E3150' },
      jungle: { face:'#5E7A49', top:'#7E9A69', edge:'#43603A' },
      space:  { face:'#332E52', top:'#4A4570', edge:'#5C5588' }
    };
    const P_G = 0.8, P_JUMP = -5.6;   // gravity + jump impulse (peak reach ~19.6px)
    function topsAt(px){ const a=[GROUND_Y]; for(const p of PLATFORMS){ if(px>=p.x0 && px<=p.x1) a.push(p.top); } return a; }
    function lerp(a,b,t){ return a+(b-a)*t; }
    function fillBand(ctx, y0, y1, c){ ctx.fillStyle=c; ctx.fillRect(0, y0, SCENE_W, y1-y0); }
    function vgrad(ctx, y0, y1, top, bot){
      for(let y=y0;y<y1;y++){
        const t=(y-y0)/Math.max(1,(y1-y0));
        ctx.fillStyle='rgb('+Math.round(lerp(top[0],bot[0],t))+','+Math.round(lerp(top[1],bot[1],t))+','+Math.round(lerp(top[2],bot[2],t))+')';
        ctx.fillRect(0,y,SCENE_W,1);
      }
    }
    function drawPlatforms(ctx, world){
      const s = PLAT_STYLE[world] || PLAT_STYLE.city;
      for(const p of PLATFORMS){
        ctx.fillStyle=s.face; ctx.fillRect(p.x0, p.top, p.x1-p.x0, 6);
        ctx.fillStyle=s.top;  ctx.fillRect(p.x0, p.top, p.x1-p.x0, 2);
        ctx.fillStyle=s.edge; ctx.fillRect(p.x0, p.top, p.x1-p.x0, 1);
      }
    }
    function drawWorld(ctx, world){
      ctx.clearRect(0,0,SCENE_W,SCENE_H);

        vgrad(ctx,0,GROUND_Y,[227,234,211],[203,221,190]);

        // distant foliage mounds
        ctx.fillStyle='#9CB182'; ctx.fillRect(0,52,60,22); ctx.fillRect(110,50,40,24);
        ctx.fillStyle='#7E9A69'; ctx.fillRect(30,58,70,16); ctx.fillRect(120,56,30,18);
        ctx.fillStyle='#6E8B5D'; ctx.fillRect(0,64,SCENE_W,GROUND_Y-64);

        drawPlatforms(ctx,'jungle');

        ctx.fillStyle='#E0CBAE'; for(let x=-13;x<=13;x++){ ctx.fillRect(122+x,26+Math.round(x*0.28),1,1); }
        drawPlatforms(ctx,'space');

        // building bands (far -> near)
        ctx.fillStyle='#787C97'; ctx.fillRect(4,44,12,GROUND_Y-44); ctx.fillRect(22,40,10,GROUND_Y-40); ctx.fillRect(120,42,13,GROUND_Y-42); ctx.fillRect(136,48,11,GROUND_Y-48);
        ctx.fillStyle='#565A79'; ctx.fillRect(16,50,14,GROUND_Y-50); ctx.fillRect(34,46,13,GROUND_Y-46); ctx.fillRect(98,48,14,GROUND_Y-48);

    // ===== Per-card pet controllers + shared animation loop =====
    const petCtl = {};   // childIndex -> controller
    const petStage = {}; // childIndex -> last stage (for evolve hop)

    function stageForChild(child){
      const total = child.tasks[data.routine].length;
      const done = child.tasks[data.routine].filter(t => t.completed).length;
      const frac = total ? done / total : 0;
      return total ? Math.round(frac * 2) : 0;
    }

    // pre-created low-res creature buffer (shared, reused each draw)
    const _lo = document.createElement('canvas'); _lo.width = CREW; _lo.height = CREH;
    const _lctx = _lo.getContext('2d'); _lctx.imageSmoothingEnabled = false;

    // ---- companions that follow (dog / RC car) ----
    const CW = 44, CH = 30, cGround = 26;
    const _clo = document.createElement('canvas'); _clo.width = CW; _clo.height = CH;
    const _cctx = _clo.getContext('2d'); _cctx.imageSmoothingEnabled = false;
    function cNewG(){ const g=[]; for(let y=0;y<CH;y++) g.push(new Array(CW).fill(null)); return g; }

    function cRect(g,x0,y0,x1,y1,c){ for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++) if(y>=0&&y<CH&&x>=0&&x<CW) g[y][x]=c; }
    function buildDog(f){
      const g=cNewG(), O='#3A2A1E', B='#B98A5C', D='#9A6E42', L='#E4D0B0';

      for(let i=0;i<4;i++){ cRect(g,lx[i],20-lift[i],lx[i]+1,cGround,i<2?D:B); cRect(g,lx[i],20-lift[i],lx[i],cGround,O); }
      const w=Math.round(Math.sin(f/6)*2); cEll(g,5,13+w,3.5,2.5,B); cEll(g,3,11+w,2,2,B);
      cEll(g,18,16,10.5,6.5,O); cEll(g,18,16,9.5,5.5,B); cEll(g,19,18,6,3,L);
      cEll(g,30,13,6.5,6,O); cEll(g,30,13,5.5,5,B);

    function buildCar(f){

      cRect(g,6,15,34,21,R1); cRect(g,6,20,34,21,R2); cRect(g,6,14,34,14,O);
      cRect(g,13,9,26,15,R1); cRect(g,14,10,25,13,W); cRect(g,13,9,26,9,O);
      cEll(g,13,22,4.2,4.2,BLK); cEll(g,26,22,4.2,4.2,BLK); cEll(g,13,22,1.6,1.6,'#8A8A90'); cEll(g,26,22,1.6,1.6,'#8A8A90');

      const aw=Math.round(Math.sin(f/7)*2); cRect(g,32,6,32,14,O); g[5][32+aw]='#C4402F'; g[4][32+aw]='#C4402F';

    function makeController(i, canvas){
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = false;
      // low-res world buffer
      const wlo = document.createElement('canvas'); wlo.width = SCENE_W; wlo.height = SCENE_H;
      const wctx = wlo.getContext('2d'); wctx.imageSmoothingEnabled = false;
      const ctl = {
        i, canvas, ctx, wlo, wctx,
        world: null, cssW: 0, cssH: 0, scale: 1,
        posX: SCENE_W/2, dir: 1, y: GROUND_Y, vy: 0, grounded: true, nextHop: 60 + Math.floor(Math.random()*120),
        moving: false, moveT: 0, idleT: 60 + Math.floor(Math.random()*180), compX: SCENE_W/2 - 30,
        frame: Math.floor(Math.random()*200)
      };
      ctl.redrawWorld = function(){
        const w = (data.children[i] && data.children[i].world) || 'city';
        ctl.world = w;
        drawWorld(wctx, w);
      };
      ctl.resize = function(){
        const rect = canvas.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const w = Math.max(1, Math.round(rect.width));
        const h = Math.max(1, Math.round(rect.height));
        if (w === ctl.cssW && h === ctl.cssH) return;
        ctl.cssW = w; ctl.cssH = h;
        canvas.width = Math.round(w * dpr);
        canvas.height = Math.round(h * dpr);
        ctl.scale = canvas.width / SCENE_W; // uniform-ish; height keyed to width
        ctx.imageSmoothingEnabled = false;
      };
      ctl.redrawWorld();
      ctl.resize();

      // throttled (e.g. background tab). ResizeObserver fires on layout.
      if (typeof ResizeObserver !== 'undefined') {
        const ro = new ResizeObserver(() => { if (canvas.isConnected) ctl.resize(); });
        ro.observe(canvas);
        ctl.ro = ro;
      }
      return ctl;
    }

    function hopPet(i){
      const c = petCtl[i];
      if (c && c.grounded) { c.vy = P_JUMP; c.grounded = false; }
    }

    // repurposed: read stage/species/world live; optionally hop on task tap / evolve
    function refreshPet(i, animate){
      const c = petCtl[i];
      const child = data.children[i];
      if (!child) return;
      // stage/species/world are re-read live every frame; this just handles the
      // tap-driven hop and keeps the world buffer in sync.
      petStage[i] = stageForChild(child);
      if (animate && c) hopPet(i);
      if (c) c.redrawWorld();
    }

    function cycleWorld(i){
      const cur = data.children[i].world || 'city';
      const next = WORLDS[(WORLDS.indexOf(cur) + 1) % WORLDS.length];
      data.children[i].world = next;
      saveData();
      const c = petCtl[i];
      if (c) c.redrawWorld();
    }

    function drawPetFrame(c){
      const child = data.children[c.i];
      if (!child) return;
      c.resize();
      c.frame++;
      const f = c.frame;
      const species = child.species || 'kanin';
      const stageI = Math.max(0, Math.min(2, stageForChild(child)));
      const st = STAGES[stageI];
      const rawGadget = st.att ? dailyGadget(child.name) : null;
      const isCompanion = rawGadget === 'dog' || rawGadget === 'rc';
      const gadget = isCompanion ? null : rawGadget;

      const margin = 16;
      const br = Math.sin(f/34), sy = 1 + br*0.03, sx = 1 - br*0.02;
      const blink = (f % 190) < 6;
      let footL=0, footR=0, bob=0;

      // ---- horizontal: idle most of the time, then a short move burst ----
      if (c.moving) {
        c.moveT--;
        c.posX += c.dir * 0.6;
        if (c.posX > SCENE_W - margin) { c.posX = SCENE_W - margin; c.dir = -1; }
        if (c.posX < margin) { c.posX = margin; c.dir = 1; }
        if (c.grounded) { const wp = Math.floor(f/6) % 2; footL = wp===0?1:0; footR = wp===1?1:0; bob = (wp===0) ? R : 0; }
        if (c.moveT <= 0) { c.moving = false; c.idleT = 150 + Math.floor(Math.random()*300); }
      } else {
        c.idleT--;
        if (c.idleT <= 0) { c.moving = true; c.moveT = 24 + Math.floor(Math.random()*70); if (Math.random() < 0.5) c.dir = -c.dir; }
      }

      // ---- vertical: gravity + platform hopping ----
      if (c.grounded) {
        // still supported at this x? (walked off an edge => fall)
        if (!topsAt(c.posX).some(T => Math.abs(T - c.y) < 0.6)) { c.grounded = false; c.vy = 0; }
        else { c.nextHop--; if (c.nextHop <= 0) { c.vy = P_JUMP; c.grounded = false; c.nextHop = 70 + Math.floor(Math.random()*150); } }
      }
      if (!c.grounded) {
        const prevY = c.y;
        c.vy += P_G; c.y += c.vy;
        if (c.vy > 0) {
          const cand = topsAt(c.posX).filter(T => T >= prevY - 0.6 && T <= c.y + 0.6);
          if (cand.length) { c.y = Math.min.apply(null, cand); c.vy = 0; c.grounded = true; c.nextHop = 40 + Math.floor(Math.random()*140); }
        }
        if (c.y > GROUND_Y) { c.y = GROUND_Y; c.vy = 0; c.grounded = true; }
      }

      // squash/stretch from vertical speed (elongate when moving fast up/down)
      let hsx = 1, hsy = 1;
      if (!c.grounded) { const st2 = Math.min(0.14, Math.abs(c.vy) * 0.024); hsy = 1 + st2; hsx = 1 - st2 * 0.6; }

      const grid = build(species, st, { blink, sx: sx*hsx, sy: sy*hsy, footL, footR, gadget, frame: f });
      _lctx.clearRect(0,0,CREW,CREH);
      for (let y=0;y<CREH;y++) for (let x=0;x<CREW;x++) if (grid[y][x]) { _lctx.fillStyle = grid[y][x]; _lctx.fillRect(x,y,1,1); }

      // ---- compose onto the visible canvas ----
      const ctx = c.ctx;
      const sX = c.canvas.width / SCENE_W;   // scene px -> device px (x)
      const sY = c.canvas.height / SCENE_H;  // scene px -> device px (y)
      ctx.clearRect(0,0,c.canvas.width,c.canvas.height);
      ctx.drawImage(c.wlo, 0,0,SCENE_W,SCENE_H, 0,0,c.canvas.width,c.canvas.height);

      // feet at the pet's live y; shadow on the nearest surface below
      const feetY = c.y;
      const below = topsAt(c.posX).filter(T => T >= c.y - 0.5);
      const shadowY = (below.length ? Math.min.apply(null, below) : GROUND_Y) + 1;
      const lift = Math.max(0, (shadowY - 1 - c.y)) / 20;
      ctx.fillStyle = 'rgba(45,42,34,'+(0.16 - lift*0.09)+')';
      ctx.beginPath();
      ctx.ellipse(c.posX*sX, shadowY*sY, (9 - lift*3)*sX, 2*sY, 0, 0, Math.PI*2);
      ctx.fill();

      // creature buffer -> scene: fixed sprite scale, anchored so buffer row cgy sits on feetY
      const spriteScale = 0.6;                 // buffer px -> scene px
      const sw = CREW * spriteScale, sh = CREH * spriteScale;
      const topScene = feetY - bob - cgy * spriteScale; // scene y of sprite top
      const flip = c.dir < 0;
      ctx.save();
      ctx.imageSmoothingEnabled = false;
      ctx.translate(Math.round(c.posX * sX), 0);
      ctx.scale(flip ? -1 : 1, 1);
      const dw = Math.round(sw * sX), dh = Math.round(sh * sY);
      ctx.drawImage(_lo, 0,0,CREW,CREH, Math.round(-dw/2), Math.round(topScene * sY), dw, dh);
      ctx.restore();

      // companion (dog / RC car) trails behind the pet on the ground
      if (isCompanion) {
        const target = c.posX - (c.moving ? c.dir : 1) * 30;
        c.compX += (target - c.compX) * 0.08;
        const cg = rawGadget === 'dog' ? buildDog(f) : buildCar(f);
        _cctx.clearRect(0,0,CW,CH);
        for (let y=0;y<CH;y++) for (let x=0;x<CW;x++) if (cg[y][x]) { _cctx.fillStyle = cg[y][x]; _cctx.fillRect(x,y,1,1); }
        const compScale = 0.5, cdw = Math.round(CW*compScale*sX), cdh = Math.round(CH*compScale*sY);
        ctx.fillStyle = 'rgba(45,42,34,0.14)';
        ctx.beginPath(); ctx.ellipse(c.compX*sX, (GROUND_Y+1)*sY, 7*sX, 1.8*sY, 0, 0, Math.PI*2); ctx.fill();
        const cflip = c.moving && c.dir < 0;
        ctx.save(); ctx.imageSmoothingEnabled = false;
        ctx.translate(Math.round(c.compX * sX), 0); ctx.scale(cflip ? -1 : 1, 1);
        ctx.drawImage(_clo, 0,0,CW,CH, Math.round(-cdw/2), Math.round((GROUND_Y - cGround*compScale) * sY), cdw, cdh);
        ctx.restore();
      }
    }

    function petLoop(){
      const keys = Object.keys(petCtl);
      for (const k of keys) {
        const c = petCtl[k];
        if (!c || !c.canvas.isConnected) { delete petCtl[k]; continue; }
        try { drawPetFrame(c); } catch (e) { /* keep loop alive */ }
      }
      requestAnimationFrame(petLoop);
    }

      const child = data.children[i];
      const total = child.tasks[data.routine].length;

      if (c) c.textContent = done + (total ? ' / ' + total : '');

      if (f) f.style.width = (total ? Math.round(done / total * 100) : 0) + '%';
      const card = document.getElementById('card-' + i);
      if (card) card.classList.toggle('complete', total > 0 && done === total);
    }

      container.innerHTML = '';

      data.children.forEach((child, childIndex) => {
        const total = child.tasks[data.routine].length;
        const done = doneCount(child);

        const card = document.createElement('div');
        card.className = 'child-card' + (total > 0 && done === total ? ' complete' : '');

        const header = document.createElement('div');
        header.className = 'child-header';

        nameElem.textContent = child.name;

        starElem.className = 'stars';
        starElem.innerHTML = `<span id="count-${childIndex}">${done}${total ? ' / ' + total : ''}</span> ⭐`;
        header.appendChild(nameElem);
        header.appendChild(starElem);
        card.appendChild(header);

        const bar = document.createElement('div');
        bar.className = 'progress-bar';
        const fill = document.createElement('div');
        fill.className = 'progress-fill';
        fill.id = 'fill-' + childIndex;
        fill.style.width = (total ? Math.round(done / total * 100) : 0) + '%';
        bar.appendChild(fill);
        card.appendChild(bar);

        const list = document.createElement('div');
        list.className = 'task-list';

        child.tasks[data.routine].forEach(task => {
          const row = document.createElement('div');
          row.className = 'task' + (task.completed ? ' done' : '');
          row.dataset.taskId = task.id;

          const check = document.createElement('div');
          check.className = 'task-check';
          check.innerHTML = '<svg class="tick" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#FBFAF6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>';

          const text = document.createElement('div');
          text.className = 'task-text';
          text.textContent = task.text;

          const menu = document.createElement('button');
          menu.className = 'task-menu';
          menu.type = 'button';
          menu.textContent = '⋯';
          menu.setAttribute('aria-label', 'Alternativ');
          menu.addEventListener('click', (e) => {
            e.stopPropagation();
            openTaskMenu(childIndex, task.id);
          });

          row.appendChild(check);
          row.appendChild(text);
          row.appendChild(menu);

          row.addEventListener('click', () => {
            task.completed = !task.completed;
            row.classList.toggle('done', task.completed);
            saveData();
            updateCardMeta(childIndex);
            refreshPet(childIndex, true);
          });

          list.appendChild(row);
        });

        card.appendChild(list);
        container.appendChild(card);
        refreshPet(childIndex, false);
      });
    }

    function renderRoutineTabs() {
      const bar = document.getElementById('routine-toggle');
      bar.innerHTML = '';
      data.routines.filter(r => r.active !== false).forEach(r => {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = r.name;
        if (r.id === data.routine) b.classList.add('active');
        b.addEventListener('click', () => switchRoutine(r.id));
        bar.appendChild(b);
      });
    }

    function switchRoutine(routine) {
      data.routine = routine;
      saveData();
      applyThemeForRoutine();
      renderRoutineTabs();
      render();
    }
