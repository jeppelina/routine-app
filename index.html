<!DOCTYPE html>
<html lang="sv">
<head>

<link rel="apple-touch-icon" sizes="180x180" href="icons/routine-icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#7C8A6B">
<link rel="icon" type="image/png" sizes="32x32" href="icons/routine-icon-32.png">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Rutiner">

  <title>Otis, Loui & Teddys Rutiner</title>

  <style>
    :root {
      --paper: #F4F0E8;
      --card: #FBFAF6;
      --ink: #3A3833;
      --muted: #8C8578;
      --faint: #B7B0A2;
      --line: #E8E2D5;
      --accent: #7C8A6B;
      --accent-hover: #6C7A5C;
      --task-bg: #F6F3EB;
      --task-bg-hover: #F0EBDF;
      --serif: ui-serif, Georgia, "Iowan Old Style", Palatino, serif;
      --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      font-family: var(--sans);
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      transition: background 0.4s ease;
      -webkit-font-smoothing: antialiased;
    }

    header { padding: 18px 16px 4px; }
    .app-bar {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .app-icon {
      width: 30px; height: 30px;
      border-radius: 8px;
      flex-shrink: 0;
      cursor: pointer;
    }
    header h1 {
      margin: 0;
      font-family: var(--serif);
      font-weight: 500;
      font-size: 22px;
      letter-spacing: 0.2px;
    }

    .routine-toggle {
      display: inline-flex;
      background: #E7E1D3;
      border-radius: 999px;
      padding: 3px;
      gap: 2px;
    }
    .routine-toggle button {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 7px 15px;
      border-radius: 999px;
      font-size: 14px;
      cursor: pointer;
      transition: color 0.2s;
    }
    .routine-toggle button.active {
      background: var(--card);
      color: var(--ink);
      box-shadow: 0 1px 2px rgba(0,0,0,0.08);
    }

    /* ===== Deadline clock (morning routine) ===== */
    .deadline-clock {
      display: flex; flex-direction: column; align-items: center;
      margin: 10px auto -2px; padding: 0 16px;
    }
    .deadline-clock[hidden] { display: none; }
    .deadline-clock svg {
      width: clamp(200px, 30vw, 310px); height: auto; display: block;
      filter: drop-shadow(0 3px 8px rgba(58,56,51,0.12));
    }
    .deadline-clock.urgent svg { animation: clock-pulse 1s ease-in-out infinite; }
    @keyframes clock-pulse { 50% { transform: scale(1.03); } }
    .clock-caption {
      margin-top: 6px; font-family: var(--serif); font-size: 19px; color: var(--ink);
      text-align: center; min-height: 1.3em;
    }
    .clock-caption b { font-weight: 600; }
    .clock-face { fill: var(--card); stroke: var(--line); stroke-width: 2.5; }
    .clock-tick { stroke: var(--faint); stroke-width: 1.2; stroke-linecap: round; }
    .clock-tick.hour { stroke: var(--ink); stroke-width: 3; }
    .clock-num { font-family: var(--serif); font-size: 15px; fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
    .clock-hand { stroke: var(--ink); stroke-linecap: round; }
    .clock-sec { stroke: #C4553F; stroke-width: 1.6; stroke-linecap: round; }
    @media (prefers-reduced-motion: reduce) { .deadline-clock.urgent svg { animation: none; } }

    #children-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
      max-width: 1100px;
      margin: 18px auto 0;
      padding: 0 16px;
    }

    .child-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px 16px 18px;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .child-card.complete {
      border-color: var(--accent);
      box-shadow: inset 0 0 0 1px var(--accent);
    }

    .child-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
    }
    .child-header h3 {
      margin: 0;
      font-family: var(--serif);
      font-weight: 500;
      font-size: 21px;
    }
    .stars {
      font-size: 14px;
      color: var(--muted);
      white-space: nowrap;
    }

    .progress-bar {
      height: 6px;
      background: #EDE8DC;
      border-radius: 3px;
      overflow: hidden;
      margin: 12px 0 14px;
    }
    .progress-fill {
      height: 100%;
      width: 0;
      background: var(--accent);
      border-radius: 3px;
      transition: width 0.45s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .task-list { display: flex; flex-direction: column; gap: 7px; }

    .task {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 12px;
      border-radius: 12px;
      background: var(--task-bg);
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s, transform 0.1s;
    }
    .task:hover { background: var(--task-bg-hover); }
    .task:active { transform: scale(0.99); }

    .task-check {
      flex: 0 0 auto;
      width: 24px; height: 24px;
      border-radius: 50%;
      border: 2px solid #D3CBB8;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.25s, border-color 0.25s;
    }
    .task-check .tick {
      opacity: 0;
      transform: scale(0.5);
      transition: opacity 0.2s, transform 0.2s;
    }
    .task.done .task-check {
      background: var(--accent);
      border-color: var(--accent);
      animation: checkPop 0.3s ease;
    }
    .task.done .task-check .tick { opacity: 1; transform: scale(1); }
    @keyframes checkPop {
      0% { transform: scale(1); }
      40% { transform: scale(1.18); }
      100% { transform: scale(1); }
    }

    .task-text {
      flex: 1;
      font-size: 15px;
      line-height: 1.3;
    }
    .task.done .task-text {
      color: var(--faint);
      text-decoration: line-through;
    }

    .task-menu {
      flex: 0 0 auto;
      background: transparent;
      border: 0;
      color: #CBC3B1;
      font-size: 20px;
      line-height: 1;
      padding: 2px 6px;
      border-radius: 6px;
      cursor: pointer;
    }
    .task-menu:hover { color: var(--muted); background: #ECE7DB; }

    .pet-scene {
      position: relative;
      height: 168px;
      margin: 0 0 12px;
      border-radius: 12px;
      overflow: hidden;
    }
    .pet-canvas {
      position: absolute; inset: 0; z-index: 0;
      width: 100%; height: 100%; display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .world-swap {
      position: absolute; top: 8px; right: 8px; z-index: 2;
      width: 30px; height: 30px; border-radius: 50%; padding: 0;
      border: 0; background: rgba(255,255,255,0.32); color: #fff;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
    }
    .world-swap:hover { background: rgba(255,255,255,0.5); }
    .pet-canvas { cursor: pointer; }
    .child-card { position: relative; }
    .child-card.evolving { z-index: 20; box-shadow: 0 0 0 100vmax rgba(30,28,24,0.32); transition: box-shadow 0.5s; }
    .progress-fill.flash { animation: barflash 0.7s ease-out; }
    @keyframes barflash { 30% { filter: brightness(1.7) saturate(1.3); box-shadow: 0 0 12px var(--accent); } }
    .confetti { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 60; }
    .admin-family-status { font-size: 14px; color: var(--muted); margin-bottom: 4px; }
    .admin-family-status b { color: var(--ink); font-weight: 600; }
    .admin-sound { display: flex; align-items: center; gap: 8px; font-size: 15px; color: var(--ink); cursor: pointer; }
    .admin-sound input { width: 18px; height: 18px; accent-color: var(--accent); }
    .pet-swap { right: 46px; }

    .admin {
      width: min(560px, 94vw);
      max-height: 88vh;
      overflow-y: auto;
      background: var(--card);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 12px 34px rgba(0,0,0,0.22);
      text-align: left;
    }
    .admin-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .admin-x { background: transparent; border: 0; font-size: 16px; color: var(--muted); cursor: pointer; }
    .admin-label { font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--faint); margin: 4px 0 8px; }
    .admin-lists { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    .admin-chip { border: 1px solid var(--line); background: #F3EFE7; color: var(--ink); border-radius: 999px; padding: 7px 14px; font-size: 14px; cursor: pointer; }
    .admin-chip.active { background: var(--accent); color: #FBFAF6; border-color: var(--accent); }
    .admin-chip.add { border-style: dashed; color: var(--muted); background: transparent; }
    .admin-chip.inactive { opacity: 0.45; }
    .admin-chip.inactive.active { opacity: 0.7; }
    .admin-listbar { display: flex; gap: 8px; margin-bottom: 16px; }
    .admin-mini { background: transparent; border: 1px solid var(--line); color: var(--muted); border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
    .admin-mini.danger { color: #B4614E; border-color: #E4C3BB; }
    .admin-tasks { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
    .admin-task { display: flex; align-items: center; gap: 8px; }
    .admin-task-text { flex: 1; min-width: 0; padding: 9px 10px; border: 1px solid var(--line); border-radius: 10px; font-size: 15px; font-family: var(--sans); color: var(--ink); background: #fff; }
    .admin-who { display: flex; gap: 5px; flex-shrink: 0; }
    .admin-pill { border: 1px solid var(--line); background: #F3EFE7; color: var(--muted); border-radius: 999px; padding: 5px 9px; font-size: 12px; cursor: pointer; }
    .admin-pill.on { background: var(--accent); color: #FBFAF6; border-color: var(--accent); }
    .admin-del { background: transparent; border: 0; color: #C3382A; font-size: 14px; cursor: pointer; padding: 4px 6px; flex-shrink: 0; }
    .admin-empty { color: var(--muted); font-size: 14px; padding: 8px 2px; }
    .admin-add { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; border-top: 1px solid var(--line); padding-top: 14px; }
    .admin-add input { flex: 1 1 160px; min-width: 0; padding: 10px; border: 1px solid var(--line); border-radius: 10px; font-size: 15px; font-family: var(--sans); color: var(--ink); background: #fff; }
    .admin-add-who { display: flex; gap: 5px; }
    .admin-upgrades { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--line); padding-top: 14px; margin-top: 18px; }
    .admin-upgrade { display: flex; align-items: center; gap: 12px; }
    .admin-upgrade canvas { width: 64px; height: 62px; image-rendering: pixelated; background: var(--task-bg); border-radius: 10px; flex-shrink: 0; }
    .admin-upgrade-name { font-family: var(--serif); font-size: 17px; min-width: 52px; }
    .admin-upgrade select { flex: 1; min-width: 0; padding: 9px 10px; border: 1px solid var(--line); border-radius: 10px; font-size: 15px; font-family: var(--sans); color: var(--ink); background: #fff; }
    .admin-add-btn { background: var(--accent); color: #FBFAF6; border: 0; border-radius: 10px; padding: 10px 16px; font-size: 14px; cursor: pointer; }

    .reset-container { text-align: center; margin: 22px 0 28px; }
    #manualResetBtn {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--muted);
      border-radius: 999px;
      padding: 9px 20px;
      font-size: 14px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }
    #manualResetBtn:hover { border-color: var(--faint); color: var(--ink); }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(45, 43, 38, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    .hidden { display: none; }
    .modal {
      width: min(340px, 90vw);
      background: var(--card);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 12px 34px rgba(0,0,0,0.22);
      text-align: left;
    }
    .modal-title { font-family: var(--serif); font-size: 17px; margin-bottom: 12px; }
    .modal-actions { display: flex; gap: 10px; justify-content: space-between; }
    .modal-btn {
      flex: 1;
      padding: 10px 12px;
      border-radius: 12px;
      border: none;
      background: var(--accent);
      color: #FBFAF6;
      cursor: pointer;
      font-size: 15px;
    }
    .modal-btn:hover { background: var(--accent-hover); }
    .modal-btn.secondary { background: #9C978A; }
    .modal-btn.danger { background: #B4614E; }
    .modal label { font-size: 14px; color: var(--muted); }
    .modal select, .modal input {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--line);
      font-size: 16px;
      margin-top: 4px;
      font-family: var(--sans);
      color: var(--ink);
      background: #fff;
    }
  </style>
</head>

<body>
  <header>
    <div class="app-bar">
      <div class="brand">
        <img src="icons/routine-icon-180.png" alt="" class="app-icon">
        <h1>Rutiner</h1>
      </div>
      <div class="routine-toggle" id="routine-toggle"></div>
    </div>
  </header>

  <div id="deadline-clock" class="deadline-clock" hidden aria-live="polite"></div>

  <div id="children-container"></div>

  <div class="reset-container">
    <button id="manualResetBtn">Återställ</button>
  </div>

  <div id="taskMenuOverlay" class="overlay hidden">
    <div class="modal">
      <div class="modal-title">Välj</div>
      <div class="modal-actions">
        <button id="taskMenuEditBtn" class="modal-btn">Redigera</button>
        <button id="taskMenuDeleteBtn" class="modal-btn danger">Ta bort</button>
        <button id="taskMenuCancelBtn" class="modal-btn secondary">Avbryt</button>
      </div>
    </div>
  </div>

  <div id="adminOverlay" class="overlay hidden">
    <div class="admin">
      <div class="admin-head">
        <div class="modal-title">Admin</div>
        <button id="adminCloseBtn" class="admin-x" type="button" aria-label="Stäng">✕</button>
      </div>
      <div class="admin-label">Listor</div>
      <div class="admin-lists" id="adminLists"></div>
      <div class="admin-listbar">
        <button id="adminToggleActiveBtn" class="admin-mini" type="button">Dölj lista</button>
        <button id="adminRenameBtn" class="admin-mini" type="button">Byt namn</button>
        <button id="adminDeleteListBtn" class="admin-mini danger" type="button">Ta bort lista</button>
      </div>
      <div class="admin-label">Uppgifter</div>
      <div class="admin-tasks" id="adminTasks"></div>
      <div class="admin-add">
        <input id="adminNewTask" type="text" placeholder="Ny uppgift…">
        <div class="admin-add-who" id="adminNewWho"></div>
        <button id="adminAddBtn" class="admin-add-btn" type="button">Lägg till</button>
      </div>
      <div class="admin-upgrades">
        <div class="admin-label">Familj (synk mellan enheter)</div>
        <div id="adminFamilyStatus" class="admin-family-status"></div>
        <div class="admin-listbar" id="adminFamilyLinked">
          <button id="adminCopyLink" class="admin-mini" type="button">Kopiera familjelänk</button>
          <button id="adminLeave" class="admin-mini danger" type="button">Koppla från den här enheten</button>
        </div>
        <div class="admin-add" id="adminFamilyJoin" style="border-top:0;padding-top:0">
          <input id="adminFamilyCode" type="text" placeholder="Klistra in familjelänk eller kod…" autocomplete="off" autocapitalize="off" spellcheck="false">
          <button id="adminJoin" class="admin-add-btn" type="button">Koppla</button>
        </div>
      </div>
      <div class="admin-upgrades">
        <div class="admin-label">Slutuppgradering (när allt är klart)</div>
        <div id="adminUpgrades" style="display:flex;flex-direction:column;gap:10px"></div>
        <div class="admin-label" style="margin-top:8px">Ljud</div>
        <label class="admin-sound"><input type="checkbox" id="adminSound"> Ljudeffekter på den här enheten</label>
      </div>
    </div>
  </div>

  <!-- Supabase (loaded but dormant until CLOUD_SYNC is turned on) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const STORAGE_KEY = 'routineData_v2';
    const defaultChildren = ['Teddy', 'Otis', 'Loui'];
    let data;

    // ===== Supabase sync (shared Familje-Mello project) =====
    // Cross-device sync. If the (free) project auto-pauses or is unreachable,
    // the app silently falls back to localStorage and re-syncs when it returns.
    // Local dev (localhost / LAN IP / file://) runs offline on localStorage so
    // tinkering never touches the family's real household. Add ?sync=1 to the
    // URL to opt back in to live sync while developing.
    const IS_LOCAL_DEV = location.protocol === 'file:' ||
      /^(localhost|127\.0\.0\.1|\[::1\]|0\.0\.0\.0|10\.\d+\.\d+\.\d+|192\.168\.\d+\.\d+|172\.(1[6-9]|2\d|3[01])\.\d+\.\d+)$/.test(location.hostname) ||
      location.hostname.endsWith('.local');
    const CLOUD_SYNC = !IS_LOCAL_DEV || new URLSearchParams(location.search).get('sync') === '1';
    if (!CLOUD_SYNC) console.info('[routine-app] Local dev mode: cloud sync OFF (add ?sync=1 to enable).');
    const SUPABASE_URL = 'https://bhurxoknmyfqymtiaycx.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJodXJ4b2tubXlmcXltdGlheWN4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5NzI5NTAsImV4cCI6MjA5NzU0ODk1MH0.YbblDF0jfZNzdIMy8rMF3t19b7b6onD91VVLi9N8kYg';
    // Which family this device syncs with. It is NOT in the page (the page is public): a device joins
    // by opening the private family link (…/routine-app/?hem=<code>) once, or by pasting the code in
    // Admin → Familj. Without it the app works fine on its own, saving only on this device.
    const HH_KEY = 'routineHousehold', ADOPT_KEY = 'routineAdoptCloud';
    const UUID_RE = /[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i;
    function setHousehold(code){
      try {
        if (code) { if (localStorage.getItem(HH_KEY) !== code) { localStorage.setItem(HH_KEY, code); localStorage.setItem(ADOPT_KEY, '1'); } }
        else localStorage.removeItem(HH_KEY);
      } catch (e) {}
    }
    function readHousehold(){
      try {
        const qs = new URLSearchParams(location.search), m = (qs.get('hem') || '').match(UUID_RE);
        if (m) { setHousehold(m[0].toLowerCase()); qs.delete('hem'); history.replaceState(null, '', location.pathname + (qs.toString() ? '?' + qs : '') + location.hash); }
        const v = localStorage.getItem(HH_KEY);
        return v && UUID_RE.test(v) ? v : null;
      } catch (e) { return null; }
    }
    const HOUSEHOLD_ID = readHousehold();
    let householdStatus = HOUSEHOLD_ID ? 'connecting' : 'none'; // none | connecting | ok | notfound | offline

    const CLIENT_ID = 'c_' + Math.random().toString(36).slice(2, 10);
    let sb = null;
    let applyingRemote = false;
    let pushTimer = null;
    // Held true until the first cloud pull resolves, so a freshly-seeded device
    // can never push its default state before it has had a chance to adopt the
    // real household data. Prevents a new/cleared device from clobbering the cloud.
    let firstSyncDone = false;

    function syncEnabled() {
      return CLOUD_SYNC && !!sb && HOUSEHOLD_ID && HOUSEHOLD_ID.indexOf('__') !== 0;
    }

    function initSupabase() {
      try {
        if (!CLOUD_SYNC) return;
        if (!HOUSEHOLD_ID || HOUSEHOLD_ID.indexOf('__') === 0) return;
        if (window.supabase && window.supabase.createClient) {
          sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } else householdStatus = 'offline'; // sync library didn't load (offline?)
      } catch (e) { console.warn('Supabase init failed', e); }
    }

    function routineIds() { return data.routines.map(r => r.id); }
    function routineName(id) { const r = data.routines.find(x => x.id === id); return r ? r.name : id; }

    function normalizeData() {
      if (!data || !Array.isArray(data.children)) return;
      if (!data.deletedLists) data.deletedLists = {};
      if (!data.deletedTasks) data.deletedTasks = {};
      if (!Array.isArray(data.routines) || !data.routines.length) {
        data.routines = [{ id: 'morgon', name: 'Morgon' }, { id: 'kväll', name: 'Kväll' }, { id: 'helg', name: 'Helg' }];
      }
      const ids = data.routines.map(r => r.id);
      if (!data.routine || ids.indexOf(data.routine) < 0) data.routine = ids[0];
      data.routines.forEach(r => { if (r.active === undefined) r.active = true; });
      const activeIds = data.routines.filter(r => r.active !== false).map(r => r.id);
      if (activeIds.length && activeIds.indexOf(data.routine) < 0) data.routine = activeIds[0];
      data.children.forEach((ch, idx) => {
        if (!ch.world) ch.world = ['city', 'jungle', 'space'][idx % 3];
        if (!ch.species) ch.species = ['kanin', 'rav', 'uggla'][idx % 3];
        if (!ch.tasks) ch.tasks = {};
        ids.forEach(r => { if (!Array.isArray(ch.tasks[r])) ch.tasks[r] = []; });
      });
      // Ensure ids + shared group-ids (identical text in a list shares one gid)
      ids.forEach(listId => {
        const textGid = {};
        data.children.forEach(ch => {
          ch.tasks[listId].forEach(t => {
            if (!t.id) t.id = makeId();
            if (t.gid) textGid[t.text] = t.gid;
            else { if (!textGid[t.text]) textGid[t.text] = 'g_' + makeId(); t.gid = textGid[t.text]; }
          });
        });
      });
      // Drop within-list duplicates (a group id appears at most once per child) so a
      // union-merge across devices can't leave two copies of the same task.
      data.children.forEach(ch => {
        ids.forEach(listId => {
          const seen = {};
          ch.tasks[listId] = ch.tasks[listId].filter(t => {
            if (!t.gid) return true;
            if (seen[t.gid]) return false;
            seen[t.gid] = 1; return true;
          });
        });
      });
      return;
      // legacy loop retained below (unreachable)
      data.children.forEach((ch) => {
        ['morgon', 'kväll', 'helg'].forEach(r => {
          if (!ch.tasks[r]) ch.tasks[r] = [];
          ch.tasks[r].forEach(t => { if (!t.id) t.id = makeId(); });
        });
      });
    }

    function schedulePush() {
      if (!syncEnabled() || applyingRemote || !firstSyncDone) return;
      clearTimeout(pushTimer);
      pushTimer = setTimeout(pushState, 400);
    }
    function pushState() {
      if (!syncEnabled() || !firstSyncDone) return;
      pushRemote(data);
    }
    async function pushRemote(state) {
      if (!syncEnabled()) return;
      try {
        const payload = Object.assign({}, state, { _src: CLIENT_ID });
        await sb.from('households').update({ state: payload, updated_at: new Date().toISOString() }).eq('id', HOUSEHOLD_ID);
      } catch (e) { console.warn('Push failed', e); }
    }
    async function pullState() {
      if (!syncEnabled()) { firstSyncDone = true; return; }
      try {
        const { data: row, error } = await sb.from('households').select('state').eq('id', HOUSEHOLD_ID).maybeSingle();
        if (error) throw error;
        if (!row) { householdStatus = 'notfound'; console.warn('Family code not found; staying local'); return; } // no pushes either
        householdStatus = 'ok';
        const remote = row && row.state;
        firstSyncDone = true;
        if (remote && Array.isArray(remote.children) && remote.children.length) {
          reconcile(remote);
        } else if (!data._seeded) {
          // Cloud empty: seed it from real data only, never from a bare default seed.
          pushRemote(data);
        }
      } catch (e) {
        console.warn('Pull failed', e); householdStatus = 'offline';
        // A device that just joined must adopt the family's data before it may push anything,
        // so it waits for a successful pull; an established device may keep saving.
        if (!data._seeded) firstSyncDone = true;
        setTimeout(() => { if (!firstSyncDone || householdStatus === 'offline') pullState(); }, 30000);
      }
    }
    // Bring local and cloud into agreement. A fresh default seed has nothing worth
    // keeping, so it adopts the cloud wholesale. Two real devices are UNION-merged so
    // a list/task added on either side survives a stale push from the other; deletions
    // are honoured through tombstones so they don't come back.
    function reconcile(remote) {
      if (!remote || remote._src === CLIENT_ID) return;
      const rem = Object.assign({}, remote); delete rem._src;
      let merged;
      if (data._seeded) {
        merged = rem;                                      // seed → take the household as-is
      } else {
        merged = mergeStates(data, rem);
      }
      // Does our merge carry content the cloud is missing? If so, stamp it as the newest
      // revision so even devices still running the old (whole-blob) code adopt the
      // superset instead of re-clobbering it. This is what makes a re-added list stick.
      const addsToCloud = !data._seeded && sig(merged) !== sig(rem);
      if (addsToCloud) merged = Object.assign({}, merged, { updatedAt: new Date().toISOString() });
      const changedLocal = sig(merged) !== sig(data) || (addsToCloud && merged.updatedAt !== data.updatedAt);
      if (changedLocal) {
        applyingRemote = true;
        data = merged;
        data._seeded = false;
        normalizeData();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        applyingRemote = false;
        applyThemeForRoutine();
        renderRoutineTabs();
        render();
        migrateSpecies();
      }
      if (addsToCloud) pushRemote(merged);
    }
    function subscribeRealtime() {
      if (!syncEnabled()) return;
      sb.channel('household-' + HOUSEHOLD_ID)
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'households', filter: 'id=eq.' + HOUSEHOLD_ID },
          (payload) => { reconcile(payload.new && payload.new.state); })
        .subscribe();
    }
    function mergeTomb(a, b) {
      const out = Object.assign({}, a || {});
      const bb = b || {};
      for (const k in bb) { if (!out[k] || bb[k] > out[k]) out[k] = bb[k]; }
      return out;
    }
    // Union-merge two household states. Presence is add-wins (a list/task on either
    // side is kept unless tombstoned); field conflicts (name, completed, world) go to
    // whichever side was saved more recently.
    function mergeStates(a, b) {
      a = a || {}; b = b || {};
      const aNewer = (a.updatedAt || '') >= (b.updatedAt || '');
      const primary = aNewer ? a : b, secondary = aNewer ? b : a;
      const delLists = mergeTomb(a.deletedLists, b.deletedLists);
      const delTasks = mergeTomb(a.deletedTasks, b.deletedTasks);
      const rMap = new Map();
      (secondary.routines || []).forEach(r => rMap.set(r.id, Object.assign({}, r)));
      (primary.routines || []).forEach(r => rMap.set(r.id, Object.assign({}, rMap.get(r.id) || {}, r)));
      Object.keys(delLists).forEach(id => rMap.delete(id));
      const routines = [...rMap.values()];
      const names = [];
      (primary.children || []).forEach(c => { if (names.indexOf(c.name) < 0) names.push(c.name); });
      (secondary.children || []).forEach(c => { if (names.indexOf(c.name) < 0) names.push(c.name); });
      const children = names.map(name => {
        const pc = (primary.children || []).find(c => c.name === name) || {};
        const sc = (secondary.children || []).find(c => c.name === name) || {};
        const tasks = {};
        routines.forEach(r => {
          const lid = r.id, tMap = new Map();
          ((sc.tasks && sc.tasks[lid]) || []).forEach(t => tMap.set(t.id, Object.assign({}, t)));
          ((pc.tasks && pc.tasks[lid]) || []).forEach(t => tMap.set(t.id, Object.assign({}, tMap.get(t.id) || {}, t)));
          tasks[lid] = [...tMap.values()].filter(t => !(t.gid && delTasks[t.gid]));
        });
        // Per-kid look (animal, background, upgrade): the most recent *choice* wins, by its own
        // timestamp, not by whose whole state was saved last. Otherwise a device that just did its
        // morning reset (which stamps the state) would put back yesterday's animal.
        const newest = (f) => { const a = pc[f + 'At'] || '', b = sc[f + 'At'] || ''; return (a || b) ? (a >= b ? pc : sc) : (pc[f] ? pc : sc); };
        const spSrc = newest('species'), wSrc = newest('world'), uSrc = newest('upgrade');
        return { name, world: wSrc.world || pc.world || sc.world, worldAt: wSrc.worldAt,
          species: spSrc.species || pc.species || sc.species, speciesSet: !!spSrc.speciesSet, speciesAt: spSrc.speciesAt,
          upgrade: uSrc.upgrade || pc.upgrade || sc.upgrade, upgradeAt: uSrc.upgradeAt, tasks };
      });
      return {
        routine: primary.routine || secondary.routine,
        lastReset: primary.lastReset || secondary.lastReset,
        routines, children,
        deletedLists: delLists, deletedTasks: delTasks,
        updatedAt: (a.updatedAt || '') > (b.updatedAt || '') ? a.updatedAt : b.updatedAt
      };
    }
    // Canonical content fingerprint — ignores updatedAt/_src/key order so we only sync
    // when the actual lists/tasks changed.
    function sig(s) {
      s = s || {};
      const rids = (s.routines || []).map(r => r.id).filter(id => !(s.deletedLists && s.deletedLists[id])).sort();
      const routines = (s.routines || []).map(r => r.id + ':' + (r.name || '') + ':' + (r.active !== false ? 1 : 0)).sort();
      const kids = (s.children || []).slice().sort((x, y) => x.name < y.name ? -1 : 1).map(c => {
        const lists = rids.map(lid => {
          const ts = (((c.tasks || {})[lid]) || []).map(t => t.id + '|' + (t.text || '') + '|' + (t.completed ? 1 : 0) + '|' + (t.gid || '')).sort();
          return lid + '=' + ts.join(',');
        });
        return c.name + ':' + (c.world || '') + (c.worldAt || '') + ':' + (c.species || '') + (c.speciesSet ? '!' : '') + (c.speciesAt || '') + ':' + (c.upgrade || '') + (c.upgradeAt || '') + '{' + lists.join(';') + '}';
      });
      return routines.join('#') + '||' + kids.join('#') + '||' +
        Object.keys(s.deletedLists || {}).sort().join(',') + '||' +
        Object.keys(s.deletedTasks || {}).sort().join(',') + '||' + (s.routine || '');
    }

      const g = build(child.species || 'kanin', STAGES[2], { frame: 40, gadget: (gadget === 'dog' || gadget === 'rc') ? null : gadget });

    function makeId() {
      return 't_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
    }

    function initData() {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored) {
        data = JSON.parse(stored);
        normalizeData();
        // Just joined a family: take the family's data as-is instead of merging this device's copy in.
        try { if (localStorage.getItem(ADOPT_KEY)) { data._seeded = true; localStorage.removeItem(ADOPT_KEY); } } catch (e) {}
        persist();
        return;
      }
      try { localStorage.removeItem(ADOPT_KEY); } catch (e) {}
      // No stored data: build a default seed. Mark it as a seed so the first cloud
      // pull adopts the real household instead of pushing these defaults over it.
      data = {
        routine: 'morgon',
        lastReset: null,
        _seeded: true,
        routines: [{ id: 'morgon', name: 'Morgon' }, { id: 'kväll', name: 'Kväll' }, { id: 'helg', name: 'Helg' }],
        children: defaultChildren.map((name, idx) => ({ name, world: ['city', 'jungle', 'space'][idx % 3], species: ['kanin', 'rav', 'uggla'][idx % 3], tasks: { morgon: [], kväll: [], helg: [] } }))
      };
      data.children.forEach(child => {
        const preset = STARTER_TASKS[child.name];
        if (!preset) return;
        ['morgon', 'kväll', 'helg'].forEach(r => {
          (preset[r] || []).forEach(text => {
            child.tasks[r].push({ id: makeId(), text, completed: false });
          });
        });
      });
      normalizeData();
      persist();
    }

    // Local-only persist: no timestamp bump, no cloud push. Used during boot/migration
    // and daily reset so opening the app never re-stamps or pushes unchanged state.
    function persist() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }
    // Genuine user edit: this device now holds real (non-seed) data, so stamp the
    // time, drop the seed flag, and sync it out.
    function saveData() {
      if (!applyingRemote) {
        data.updatedAt = new Date().toISOString();
        // Keep the seed flag until the first cloud pull has resolved, so an early
        // tap on a still-seeded device can't turn it into a cloud-clobbering push.
        if (firstSyncDone) data._seeded = false;
      }
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));

    }
    function remoteIsNewer(remote) {
      return (remote.updatedAt || '') > (data.updatedAt || '');
    }

    // Clear yesterday's checks on the first open of a new day.
    // A fresh seed just records the date locally (persist) so it keeps its seed flag
    // until the cloud pull; a real reset on real data stamps + syncs as before.
    function checkDailyReset() {
      const today = todayStockholm();
      const saveReset = () => { data._seeded ? persist() : saveData(); };
      if (!data.lastReset) { data.lastReset = today; saveReset(); return; }
      if (data.lastReset !== today) {
        data.children.forEach(ch => {
          routineIds().forEach(r => (ch.tasks[r] || []).forEach(t => t.completed = false));
        });
        data.lastReset = today;
        saveReset();
      }
    }

    function doneCount(child) {

        let col=P.body;

        else if(isLeo && (inEll(x,y,earLcx,leoEarCy-0.6*k,1.4*k*ek,1.3*k*ek)||inEll(x,y,earRcx,leoEarCy-0.6*k,1.4*k*ek,1.3*k*ek))) col=P.ear;
        else if((isFox||isWolf) && (inTri(x,y,earLcx,earCy-earRy,2.2*k*ek,earCy-earRy*0.35)||inTri(x,y,earRcx,earCy-earRy,2.2*k*ek,earCy-earRy*0.35))) col=P.ear;
        else if(inEll(x,y,cx,bodyCy+3*R*sy,5.6*k,6.2*k*sy)) col=P.belly;
        else { const core=inEll(x,y,cx-bodyRx*0.16,bodyCy-bodyRy*0.14,bodyRx*0.72,bodyRy*0.74);
          if(!core){ const dd=(x+0.5-cx)+(y+0.5-bodyCy); if(dd>bodyRx*0.42) col=P.dark; else if(dd<-bodyRx*0.75) col=P.light; } }
        g[y][x]=col;
      }

      const isCoat=(c)=>c===P.body||c===P.light||c===P.dark;
      if(o.charge>0){ // fur stands on end while charging
        const pts=[];
        for(let y=1;y<CREH-1;y++) for(let x=1;x<CREW-1;x++){ if(g[y][x]!==P.out||!inEll(x,y,cx,bodyCy,bodyRx+1,bodyRy+1)) continue;
          const h=(((x*73856093)^(y*19349663))>>>0)%100; if(h/100<o.charge*0.32) pts.push([x,y]); }
        for(const [x,y] of pts){ const vx=x+0.5-cx, vy=y+0.5-bodyCy, L=Math.hypot(vx,vy)||1, len=1+Math.round(o.charge*2.6);
          for(let i=1;i<=len;i++) set(Math.round(x+vx/L*i),Math.round(y+vy/L*i),(i===len&&((o.frame||0)>>1)%2)?'#F6D85A':P.out); }
      }
      if(isDog){ // curly coat
        for(let y=0;y<CREH;y++) for(let x=0;x<CREW;x++){ const c=g[y][x]; if(!curlAt(x,y)) continue;
          if(isCoat(c)) g[y][x]=P.curl; else if(c===P.belly) g[y][x]=P.curlL; }
      }
      if(isLeo){ // rosettes (rings with a warm centre) + small forehead dots
        const spots=[[-0.42,-0.72,1],[0.40,-0.74,1],[0,-0.56,0.8],[-0.82,-0.18,1],[0.82,-0.22,1],[-0.78,0.36,0.9],[0.80,0.32,0.9],[-0.55,0.74,0.8],[0.56,0.76,0.8],[-0.2,-0.36,0.45],[0.22,-0.34,0.45]];
        for(const [u,v,s] of spots){ const scx=cx+u*bodyRx, scy=bodyCy+v*bodyRy, r=1.35*k*s, ri=r*0.5;
          for(let y=Math.floor(scy-r-1);y<=Math.ceil(scy+r+1);y++) for(let x=Math.floor(scx-r-1);x<=Math.ceil(scx+r+1);x++){
            if(y<0||y>=CREH||x<0||x>=CREW||!isCoat(g[y][x])) continue;
            if(inEll(x,y,scx,scy,r,r)) g[y][x]=(r>=2.2&&inEll(x,y,scx,scy,ri,ri))?P.rosette:P.spot; } }
      }
      if(isDog){ // floppy ears hanging at the sides of the head, tips swinging outward
        const erx=2.5*k*Math.max(0.9,ek), ery=5.6*k*Math.max(0.85,ek)*sy;
        for(const sgn of [-1,1]){
          const ecx=cx+sgn*bodyRx*0.86, ecy=bodyCy-bodyRy*0.12, a=sgn*0.22, ca=Math.cos(a), sa=Math.sin(a);
          const inE=(x,y)=>{ const dx=x+0.5-ecx, dy=y+0.5-ecy, u=dx*ca+dy*sa, v=-dx*sa+dy*ca; return (u/erx)**2+(v/ery)**2<=1; };
          for(let y=Math.floor(ecy-ery-2);y<=Math.ceil(ecy+ery+2);y++) for(let x=Math.floor(ecx-ery-2);x<=Math.ceil(ecx+ery+2);x++){
            if(!inE(x,y)) continue;
            const border=!inE(x-1,y)||!inE(x+1,y)||!inE(x,y-1)||!inE(x,y+1);
            set(x,y, border?P.out:(curlAt(x,y)?P.curl:P.ear)); }
        }
      }
      if(o.gadget==='jetpack' && isDog) drawJetpack();
      if(wereLook){ // werewolf mane: spiky tufts on the crown and cheeks
        const topY=bodyCy-bodyRy;
        const tufts=[[-2.6,0.9],[0,1.2],[2.6,0.9]].map(([dx,h])=>({ax:cx+dx*k, ay:topY-2.2*k*h, w:1.5*k, by:topY+1.5*k}));
        const inTuft=(x,y)=>tufts.some(t=>inTri(x,y,t.ax,t.ay,t.w,t.by));
        for(let y=0;y<CREH;y++) for(let x=0;x<CREW;x++){ if(!inTuft(x,y)) continue;
          const border=(!inTuft(x-1,y)&&!g[y][x-1])||(!inTuft(x+1,y)&&!g[y][x+1])||(!inTuft(x,y-1)&&!(g[y-1]||[])[x]);
          set(x,y,border?P.out:P.dark); }
        for(const sgn of [-1,1]) for(let i=0;i<3;i++){ const bx=Math.round(cx+sgn*(bodyRx-1)), by=Math.round(bodyCy+bodyRy*0.25)+i*rr(2);
          for(let j=0;j<rr(2);j++){ set(bx+sgn*j,by-j,P.out); set(bx+sgn*j-sgn,by-j+1,P.dark); } }
      }

      function foot(fx,off){ const w=rr(3); for(let x=fx;x<fx+w;x++) for(let y=bodyBottom-rr(1)-off;y<=bodyBottom+rr(1)-off;y++){ if(y===bodyBottom+rr(1)-off||x===fx||x===fx+w-1) set(x,y,P.out); else set(x,y,P.foot);} }
      foot(cx-Math.round(7*k),(o.footL||0)*R); foot(cx+Math.round(4*k),(o.footR||0)*R);

      const eyeCy=Math.round(bodyCy+(st.key==='cub'?rr(1):0));
      const eyeLx=Math.round(cx-4.2*R), eyeRx=Math.round(cx+4.2*R);
      const er=(isOwl?1.85:1.2)*R, erY=er*1.12;
      if(o.blink){ for(const ex of [eyeLx,eyeRx]) for(let dx2=-Math.round(er);dx2<=Math.round(er);dx2++) setIf(ex+dx2,eyeCy,P.out); }
      else if(isOwl){
        const discRx=(eyeRx-cx)+er+1, discRy=erY+rr(1);
        for(let y=0;y<CREH;y++) for(let x=0;x<CREW;x++){ if(g[y][x] && inEll(x,y,cx,eyeCy,discRx,discRy)) g[y][x]=P.belly; }
        for(const ex of [eyeLx,eyeRx]){
          for(let y=0;y<CREH;y++) for(let x=0;x<CREW;x++){ if(g[y][x] && inEll(x,y,ex,eyeCy,er+1,erY+1)){ g[y][x]= inEll(x,y,ex,eyeCy,er*0.5,erY*0.55)?P.eye : (inEll(x,y,ex,eyeCy,er,erY)?'#E0A64E':P.out); } }
          set(Math.round(ex-er*0.4),Math.round(eyeCy-erY*0.4),'#FFFFFF');
        }
      }
      else if(P.iris){ // werewolf: glowing amber eyes with slit pupils
        for(const ex of [eyeLx,eyeRx]){
          for(let y=0;y<CREH;y++) for(let x=0;x<CREW;x++){ if(g[y][x] && inEll(x,y,ex,eyeCy,er+0.4,erY+0.4)) g[y][x]= inEll(x,y,ex,eyeCy,0.6,erY)?P.eye:P.iris; }
          setIf(Math.round(ex-er*0.5),Math.round(eyeCy-erY*0.5),'#FFF6D6');
        }
      }
      else{
        for(let y=0;y<CREH;y++) for(let x=0;x<CREW;x++){ if(g[y][x] && (inEll(x,y,eyeLx,eyeCy,er,erY)||inEll(x,y,eyeRx,eyeCy,er,erY))) g[y][x]=P.eye; }
        for(const ex of [eyeLx,eyeRx]){ setIf(Math.round(ex-er*0.45),Math.round(eyeCy-erY*0.45),'#F7F1E6'); setIf(Math.round(ex+er*0.5),Math.round(eyeCy+erY*0.45),'#6B5F55'); }
      }
      if(att){
        const L=Math.round(3*R); for(let i=0;i<=L;i++){ const yy=Math.round(eyeCy-erY-4+i*3/L); setIf(Math.round(eyeLx-er-1+i),yy,P.out); setIf(Math.round(eyeLx-er-1+i),yy-1,P.out); setIf(Math.round(eyeRx+er+1-i),yy,P.out); setIf(Math.round(eyeRx+er+1-i),yy-1,P.out); }
        for(const sgn of [-1,1]){ const bx=cx+sgn*(Math.round(bodyRx)+rr(1)); set(bx,Math.round(eyeCy),P.dark); set(bx+sgn,Math.round(eyeCy-rr(1)),P.dark); set(bx+sgn*rr(2),Math.round(eyeCy+rr(1)),P.dark);} }
      for(const sgn of [-1,1]){ const chx=Math.round(cx+sgn*6*R), chy=Math.round(eyeCy+2*R); setIf(chx,chy,P.cheek); setIf(chx-sgn,chy,P.cheek); }
      if(isOwl){ const by=Math.round(eyeCy+1.5*R); for(let i=0;i<rr(2);i++) set(cx,by+i,P.beak); set(cx-1,by,P.out); set(cx+1,by,P.out); set(cx,by+rr(2),P.out); }
      else { const ny=Math.round(eyeCy+2.0*R); const e=rr(2), m=ny+rr(1)+1;
        if(P.nose){ setIf(cx-1,ny,P.nose); setIf(cx,ny,P.nose); setIf(cx+1,ny,P.nose); setIf(cx,ny+1,P.nose); if(isDog&&att){ setIf(cx-2,ny,P.nose); setIf(cx+2,ny,P.nose); } }
        else setIf(cx,ny,P.out);
        if(isDog){ setIf(cx,m+2,P.tongue); setIf(cx+1,m+2,P.tongue); setIf(cx,m+3,P.tongue); setIf(cx+1,m+3,P.tongue); }
        if(wereLook){ setIf(cx-e+1,m+2,'#FFFFFF'); setIf(cx-e+1,m+3,'#FFFFFF'); setIf(cx+e-1,m+2,'#FFFFFF'); setIf(cx+e-1,m+3,'#FFFFFF'); }
        if(att){ setIf(cx-e,m+1,P.out); setIf(cx-Math.round(e*0.5),m,P.out); setIf(cx,m,P.out); setIf(cx+Math.round(e*0.5),m,P.out); setIf(cx+e,m+1,P.out); setIf(cx-rr(1),m+2,'#FFFFFF'); }
        else { setIf(cx-e,m,P.out); setIf(cx-Math.round(e*0.5),m+1,P.out); setIf(cx,m+1,P.out); setIf(cx+Math.round(e*0.5),m+1,P.out); setIf(cx+e,m,P.out); }
        if(o.howl){ for(let y=m-1;y<=m+rr(2.5);y++) for(let x=cx-rr(1.5);x<=cx+rr(1.5);x++){ if(inEll(x,y,cx,m+rr(0.8),rr(1.4),rr(1.8))) setIf(x,y,inEll(x,y,cx,m+rr(1.2),rr(0.7),rr(0.9))?'#B5485A':P.out); } } }

      if(att && (isRabbit||isFox)){
        for(const sgn of [-1,1]){ const hx=cx+sgn*rr(3), len=Math.round(5*R); for(let i=0;i<len;i++){ const hy=Math.round(earCy+rr(2)-i*1.3), hxx=hx+sgn*Math.round(i*0.55); set(hxx,hy,HORN); set(hxx+sgn,hy,HORN_D); set(hxx,hy+1,HORN_D);} }
      }
      if(att){
        for(const sgn of [-1,1]){ const bx=cx+sgn*Math.round(bodyRx*0.92); set(bx,Math.round(bodyCy-rr(1)),P.dark); set(bx+sgn,Math.round(bodyCy-rr(2)),P.dark); set(bx+sgn*rr(2),Math.round(bodyCy),P.dark);} }

      if(att){
        const ny=Math.round(bodyCy+bodyRy*0.42), th=rr(2);
        for(let x=cx-Math.round(bodyRx*0.8);x<=cx+Math.round(bodyRx*0.8);x++){ for(let t=0;t<th;t++) setIf(x,ny+t,SCARF.fill); setIf(x,ny+th,SCARF.dark); }
        const fl=Math.round(Math.sin((o.frame||0)/12)*R); const txp=cx-Math.round(bodyRx*0.8);
        for(let i=0;i<rr(4);i++){ set(txp-rr(1)-i,ny+th+i+fl,i<rr(3)?SCARF.fill:SCARF.dark); set(txp-rr(1)-i,ny+th+1+i+fl,SCARF.dark); }
      }

      function setOrPlace(gr,x,y,c){ if(y>=0&&y<CREH&&x>=0&&x<CREW) gr[y][x]=c; }

      if(isOwl){
        for(const sgn of [-1,1]){ const wx=cx+sgn*bodyRx*0.72; for(let y=0;y<CREH;y++) for(let x=0;x<CREW;x++){ if(inEll(x,y,wx,bodyCy+bodyRy*0.15,2.6*k,bodyRy*0.72)){ setIf(x,y, (Math.abs(x+0.5-wx)>1.6*k)?P.out:P.dark);} } }
        for(const sgn of [-1,1]){ const tx=cx+sgn*4; for(let i=0;i<3;i++){ set(tx+sgn*i,Math.round(bodyCy-bodyRy+2-i),P.dark);} }
      }

      if(o.gadget==='cape'){ const ny=Math.round(bodyCy+bodyRy*0.28); setIf(cx-1,ny,CAPE.dark); setIf(cx,ny,CAPE.clasp); setIf(cx+1,ny,CAPE.dark); }
      if(o.gadget==='shield'){
        const su=o.shieldUp||0, shx=cx-bodyRx*(0.95+0.3*su), shy=bodyCy+bodyRy*(0.12-0.32*su), r=5.2*k;
        for(let y=0;y<CREH;y++) for(let x=0;x<CREW;x++){ if(inEll(x,y,shx,shy,r,r*1.05)){ let c=SHIELD.face; if(!inEll(x,y,shx,shy,r-1,r*1.05-1)) c=SHIELD.dark; else if(!inEll(x,y,shx,shy,r-1.6,(r-1.6)*1.05)) c=SHIELD.rim; if(inEll(x,y,shx,shy,1.4*k,1.4*k)) c=SHIELD.boss; set(x,y,c);} }
      }
      function star(sxp,syp,c,sz){ const X=Math.round(sxp),Y=Math.round(syp); for(let i=1;i<=sz;i++){ set(X,Y-i,c);set(X,Y+i,c);set(X-i,Y,c);set(X+i,Y,c);} set(X,Y,'#FFFFFF'); }
      if(o.gadget==='magic'){ const t=o.magicAngle!=null?o.magicAngle:(o.frame||0)/22; for(let i=0;i<5;i++){ const a=t+i*1.2566; star(cx+Math.cos(a)*bodyRx*1.2, bodyCy+Math.sin(a)*bodyRy*0.95, i%2?'#E9C879':'#9FE0EC', Math.round(1.3*R)); } }
      if(o.gadget==='electricity'){
        const bolt=[[0,0],[-2,3],[1.5,4.5],[-1,8],[2.5,9.5],[-0.5,13]];
        for(const sgn of [-1,1]){ if(!(o.charge>0.5) && (((o.frame||0)>>2)+(sgn>0?1:0))%2) continue; const ox=cx+sgn*bodyRx*1.02, oy=bodyCy-bodyRy*0.55;
          for(let j=0;j<bolt.length-1;j++){ let x1=ox+sgn*bolt[j][0]*R*0.7, y1=oy+bolt[j][1]*R*0.7, x2=ox+sgn*bolt[j+1][0]*R*0.7, y2=oy+bolt[j+1][1]*R*0.7, steps=Math.round(Math.hypot(x2-x1,y2-y1)); for(let s=0;s<=steps;s++){ set(Math.round(x1+(x2-x1)*s/steps),Math.round(y1+(y2-y1)*s/steps), s%3?'#F0C64B':'#FBE7A0'); } } }
      }
      if(o.gadget==='drone' && !o.noDrone){
        const dxp=cx, dyp=Math.round(bodyCy-bodyRy-7*R+Math.sin((o.frame||0)/16)*R);
        for(let y=0;y<CREH;y++) for(let x=0;x<CREW;x++){ if(inEll(x,y,dxp,dyp,3.4*R,2*R)) set(x,y,(!inEll(x,y,dxp,dyp,2.4*R,1.2*R))?'#2E2E32':'#4A4A50'); }
        set(dxp,Math.round(dyp),'#8FD16A');
        const rw=(((o.frame||0)>>1)%2)?Math.round(2.4*R):Math.round(3.6*R);
        for(const sgn of [-1,1]){ const rx0=Math.round(dxp+sgn*3.4*R), ry0=Math.round(dyp-2*R); for(let i=0;i<rw;i++){ set(rx0+sgn*i-sgn*Math.round(rw/2),ry0,'#6A6A70'); } set(rx0,ry0-1,'#2E2E32'); }
      }
      if(toolG){ for(let y=0;y<CREH;y++) for(let x=0;x<CREW;x++) if(toolG[y][x]) g[y][x]=toolG[y][x]; }
      return g;
    }

    // ---- daily gadget pool + deterministic pick ----
    const GADGET_POOL = ['sword','hammer','staff','shield','jetpack','cape','magic','electricity','drone','dog','rc'];
    function petHash(str){ let h=1779033703^str.length; for(let i=0;i<str.length;i++){ h=Math.imul(h^str.charCodeAt(i),3432918353); h=h<<13|h>>>19; } return h>>>0; }
    function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
    function dailyGadget(name){
      const rnd=mulberry32(petHash(name+'|'+todayStockholm()));
      return GADGET_POOL[Math.floor(rnd()*GADGET_POOL.length)];
    }
    // Final-stage upgrade: chosen in Admin per child, or 'random' (default) = new one each day.
    const GADGET_NAMES = { random:'🎲 Slumpa varje dag', sword:'⚔️ Svärd', hammer:'🔨 Hammare', staff:'🔮 Trollstav', shield:'🛡️ Sköld',
      jetpack:'🚀 Jetpack', cape:'🦸 Mantel', magic:'✨ Magi', electricity:'⚡ Blixtar', drone:'🛸 Drönare', dog:'🐕 Hundkompis', rc:'🏎️ Radiobil' };
    function gadgetFor(child){
      return GADGET_POOL.indexOf(child.upgrade) >= 0 ? child.upgrade : dailyGadget(child.name);
    }

    // ===== Pixel worlds (muted backdrops + one raised ledge each) =====
    const WORLDS = ['city', 'jungle', 'space'];
    // Low-res scene buffer size (drawn scaled up onto the visible canvas).
    const SCENE_W = 150, SCENE_H = 84, GROUND_Y = 74;
    const FLY_MIN_Y = 38, FLY_MAX_Y = 56; // feet height range while jetpacking
    // Dense floating platforms (shared layout, styled per world). Heights/spacing
    // tuned so a jump (reach ~20px) climbs exactly one level; ~18px gaps let the
    // pet fall a level when it steps off an edge. Levels overlap in x so 1->2->3
    // is climbable.
    const PLATFORMS = [
      { x0:18, x1:44,  top:58 }, { x0:62, x1:88,  top:58 }, { x0:106, x1:132, top:58 }, // level 1
      { x0:30, x1:56,  top:42 }, { x0:84, x1:110, top:42 },                             // level 2
      { x0:40, x1:64,  top:27 }                                                          // level 3
    ];
    const PLAT_STYLE = {
      city:   { face:'#3F4260', top:'#5C6088', edge:'#2E3150' },
      jungle: { face:'#5E7A49', top:'#7E9A69', edge:'#43603A' },
      space:  { face:'#332E52', top:'#4A4570', edge:'#5C5588' }
    };
    const P_G = 0.8, P_JUMP = -5.6;   // gravity + jump impulse (peak reach ~19.6px)
    function topsAt(px){ const a=[GROUND_Y]; for(const p of PLATFORMS){ if(px>=p.x0 && px<=p.x1) a.push(p.top); } return a; }
    function lerp(a,b,t){ return a+(b-a)*t; }
    function fillBand(ctx, y0, y1, c){ ctx.fillStyle=c; ctx.fillRect(0, y0, SCENE_W, y1-y0); }
    function vgrad(ctx, y0, y1, top, bot){
      for(let y=y0;y<y1;y++){
        const t=(y-y0)/Math.max(1,(y1-y0));
        ctx.fillStyle='rgb('+Math.round(lerp(top[0],bot[0],t))+','+Math.round(lerp(top[1],bot[1],t))+','+Math.round(lerp(top[2],bot[2],t))+')';
        ctx.fillRect(0,y,SCENE_W,1);
      }
    }
    function drawPlatforms(ctx, world){
      const s = PLAT_STYLE[world] || PLAT_STYLE.city;
      for(const p of PLATFORMS){
        ctx.fillStyle=s.face; ctx.fillRect(p.x0, p.top, p.x1-p.x0, 6);
        ctx.fillStyle=s.top;  ctx.fillRect(p.x0, p.top, p.x1-p.x0, 2);
        ctx.fillStyle=s.edge; ctx.fillRect(p.x0, p.top, p.x1-p.x0, 1);
      }
    }
    function drawWorld(ctx, world){
      ctx.clearRect(0,0,SCENE_W,SCENE_H);
      if(world==='jungle'){
        vgrad(ctx,0,GROUND_Y,[227,234,211],[203,221,190]);
        // soft canopy haze
        ctx.fillStyle='rgba(255,255,255,0.14)'; ctx.fillRect(0,20,SCENE_W,14);
        // distant foliage mounds
        ctx.fillStyle='#9CB182'; ctx.fillRect(0,52,60,22); ctx.fillRect(110,50,40,24);
        ctx.fillStyle='#7E9A69'; ctx.fillRect(30,58,70,16); ctx.fillRect(120,56,30,18);
        ctx.fillStyle='#6E8B5D'; ctx.fillRect(0,64,SCENE_W,GROUND_Y-64);
        // vine
        ctx.fillStyle='#6E8B5D'; for(let y=0;y<28;y++){ ctx.fillRect(14+Math.round(Math.sin(y/5)*2), y, 2, 1); }
        drawPlatforms(ctx,'jungle');
        fillBand(ctx,GROUND_Y,SCENE_H,'#4E6A43');
        ctx.fillStyle='#43603A'; ctx.fillRect(0,GROUND_Y,SCENE_W,2);
      } else if(world==='space'){
        vgrad(ctx,0,GROUND_Y,[35,38,74],[62,55,96]);
        ctx.fillStyle='#EFE9D4';
        const stars=[[15,12],[35,8],[60,16],[90,10],[115,18],[135,11],[10,36],[142,40],[75,7],[128,30],[24,54],[100,44]];
        stars.forEach(s=>ctx.fillRect(s[0],s[1],1,1));
        // planet with ring

    function makeController(i, canvas){

        moving: false, moveT: 0, idleT: 60 + Math.floor(Math.random()*180), compX: SCENE_W/2 - 30,

    function hopPet(i){

    }

    // repurposed: read stage/species/world live; optionally hop on task tap / evolve
    function refreshPet(i, animate){
      const c = petCtl[i];

      // tap-driven hop and keeps the world buffer in sync.

    function cycleWorld(i){
      const cur = data.children[i].world || 'city';

      data.children[i].worldAt = new Date().toISOString();

    const SPECIES_PICKS = { teddy: 'hund', loui: 'varg', louie: 'varg', otis: 'leopard' };
    function pickFor(name){

      data.children.forEach(ch => {

    // ===== Pet actions, evolutions & effects =====

      const t = a.currentTime + 0.01;

        case 'tick': sfxTone(a,880,t,0.09,'sine',0.09,1320); break;

          if (t===22 && a.obj && !a.obj.cut){ const ob=a.obj; ob.cut=true;

      cape: { kind:'gadget',

    const QUIRK_FOR = { hund:'q_hund', leopard:'q_leopard', varg:'q_varg', varulv:'q_varg' };

    function startAct(c, type, env, ambient){
      const def=ACTIONS[type]; if (!def) return;
      const a=def.start ? def.start(c, env) : {};
      if (!a){ if (def.kind==='gadget') c.actCool=90; else c.quirkCool=120; return; }
      a.type=type; a.kind=def.kind; a.t=0; a.ambient=ambient; c.act=a; c.moving=false;
    }
    function endAct(c){ const a=c.act; c.act=null; c.compAng=0;
      if (a && a.kind==='gadget') c.actCool=Math.round(rand(300,600));
      else if (a && a.kind==='quirk') c.quirkCool=Math.round(rand(700,1400)); }

    // ---- evolution celebrations ----
    function startEvolution(c, child, from, to){
      c.act=null; c.flying=false; c.compAng=0;
      const kind = to===2 ? (child.species==='varg' ? 'were' : 'final') : 'grow';
      c.evo={ kind, t:0, from, to };
      if (kind!=='grow'){ const card=document.getElementById('card-'+c.i); if (card) card.classList.add('evolving'); }
    }
    function endEvolution(c){ c.evo=null; c.actCool=25; c.nextActLoud=true;
      const card=document.getElementById('card-'+c.i); if (card) card.classList.remove('evolving'); }
    function stepEvolution(c, e){
      const v=c.evo, t=v.t, G=geomFor(STAGES[v.to]), cyS=c.y-(cgy-G.bodyCy)*SPR;
      const pose={ drawStage:v.to };
      const pop=(t0)=>{ const q=t-t0; if (q<0) return 1; if (q<12) return 1+0.28*Math.sin(q/12*Math.PI); return 1+0.06*Math.sin((q-12)*0.6)*Math.exp(-(q-12)/10); };
      if (v.kind==='grow'){
        if (t<40){ pose.drawStage=v.from; pose.spinX=Math.cos(t*0.45); pose.glow=smooth(t/40)*0.6; pose.lift=smooth(t/40)*5; }
        else { pose.lift=5*(1-smooth((t-40)/18)); pose.sx=pose.sy=pop(40); pose.glow=Math.max(0,0.6-(t-40)/30); }
        if (t===40){ burst(c,c.posX,cyS-5,22,['#FFE58A','#FFFFFF','#F3C86A'],{ shape:'star' }); c.flash=0.45; flashBar(c.i); sfx('evolve'); }
        if (t>=75) v.done=true;
      } else if (v.kind==='final'){
        const tool = ['sword','hammer','staff'].indexOf(e.gadget)>=0;
        if (t<70){ pose.drawStage=v.from; pose.beam=smooth(t/20); pose.lift=smooth(t/70)*16; pose.spinX=Math.cos(t*0.5); pose.glow=smooth(t/70)*0.9;
          if (t%3===0) addPart(c,{ x:c.posX+rand(-9,9), y:c.y-rand(0,10), vy:-rand(0.5,1.1), life:40, c:'#FFF4C8', s:1, shape:'spark' }); }
        else if (t<125){ pose.beam=1; pose.lift=16; pose.glow=Math.max(0.3,0.9-(t-70)/40); pose.sx=pose.sy=pop(70);
          if (tool){ const q=smooth((t-70)/55); pose.tool={ ang:TOOL_REST+(1-q)*4*Math.PI, offY:-(1-q)*40 }; }
          if (t%4===0){ const an=Math.random()*Math.PI*2; addPart(c,{ x:c.posX+Math.cos(an)*16, y:c.y-16+Math.sin(an)*14-16, vy:-0.2, life:24, c:Math.random()<0.5?'#FFE58A':'#FFFFFF', s:1, shape:'star' }); } }
        else { const q=(t-125)/30; pose.beam=1-smooth((t-125)/40); pose.lift=16*(1-smooth(q)); if (t>=155) pose.sy=1-0.1*Math.sin(Math.min(1,(t-155)/15)*Math.PI); }
        if (t===70){ burst(c,c.posX,cyS-16,30,['#FFE58A','#FFFFFF','#F3C86A','#9FE0EC'],{ shape:'star', vmax:2.4 }); c.flash=0.7; c.shake=6; flashBar(c.i); sfx('evolveBig');
          if (e.gadget==='dog'||e.gadget==='rc') c.compX=c.posX+(c.posX<SCENE_W/2?1:-1)*95; }
        if (t>=170) v.done=true;
      } else { // 'were': moonrise, howl, transformation
        const moonA = t<170 ? smooth(t/40) : 1-smooth((t-170)/60);
        pose.night = t<170 ? smooth(t/50)*0.55 : 0.55*(1-smooth((t-170)/60));
        pose.moon = { x:36, y:lerp(48,16,smooth(t/60)), a:moonA };
        if (t<110) pose.drawStage=v.from;
        if (t>=50 && t<110){ pose.howl=true; pose.blink=true; pose.tilt=-0.22*c.dir;
          if ((t-50)%12===0) addPart(c,{ x:c.posX+c.dir*4, y:c.y-20, vx:c.dir*0.35, vy:-0.45, life:40, c:'#E8E2F8', s:1, shape:'arc' }); }
        if (t===52) sfx('howl');
        if (t>=110 && t<170){ const per=Math.max(2,Math.round(10-(t-110)/7)); pose.drawStage=(Math.floor((t-110)/per)%2) ? v.to : v.from; c.shake=Math.max(c.shake,1.5);
          if (t%3===0) addPart(c,{ x:c.posX+rand(-12,12), y:c.y-rand(2,26), vx:rand(-0.3,0.3), vy:-0.4, life:24, c:Math.random()<0.5?'#9C86D8':'#5D5668', s:1.2, shape:'spark' }); }
        if (t===170){ burst(c,c.posX,cyS-4,28,['#B9A6E8','#FFFFFF','#F2C14E'],{ shape:'star', vmax:2.4 }); c.flash=0.6; c.shake=8; flashBar(c.i); sfx('evolveBig'); }
        if (t>=170) pose.sx=pose.sy=pop(170);
        if (t>=235) v.done=true;
      }
      v.t++;

      c.rings.forEach(r => { r.r += r.vr; ctx.strokeStyle = 'rgba(246,216,90,'+(r.life/r.max)+')'; ctx.lineWidth = 1.4*sX; ctx.beginPath();
        for (let i=0;i<=28;i++) { const a = i/28*Math.PI*2, rr2 = r.r + (i%2 ? 1.6 : -1.6); const x = (r.x + Math.cos(a)*rr2)*sX, y = (r.y + Math.sin(a)*rr2*0.7)*sY; i ? ctx.lineTo(x,y) : ctx.moveTo(x,y); } ctx.stroke(); });
      drawParticles(c, ctx, sX, sY);
      if (c.flash > 0.02) { ctx.fillStyle = 'rgba(255,255,255,'+c.flash+')'; ctx.fillRect(-10,-10,c.canvas.width+20,c.canvas.height+20); c.flash *= 0.84; } else c.flash = 0;
      ctx.restore();
    }

    // tap a pet: it reacts (unless it's busy with an upgrade move or evolving)
    function tapPet(i){
      const c = petCtl[i]; if (!c || c.evo) return;
      if (c.act && c.act.kind === 'gadget') return;
      sfx('boop');
      if (c.flying) { for (let k=0;k<3;k++) addPart(c, { x: c.posX + rand(-8,8), y: c.y - 24, vy: -0.4, life: 46, c: '#E86F86', s: 1, shape: 'heart' }); return; }
      c.act = null;
      const types = ['r_giggle','r_wave','r_spin'];
      startAct(c, types[Math.floor(Math.random()*types.length)], { world: c.world }, false);
    }

    // everyone done: confetti over the whole page + every pet cheers
    function allDone(){
      const kids = data.children.filter(ch => (ch.tasks[data.routine] || []).length);
      return kids.length > 0 && kids.every(ch => ch.tasks[data.routine].every(t => t.completed));
    }
    function celebrateAll(){
      Object.values(petCtl).forEach(c => { if (c) c.cheer = 100; });
      setTimeout(() => sfx('fanfare'), 350);
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const cv = document.createElement('canvas'); cv.className = 'confetti'; document.body.appendChild(cv);
      const dpr = Math.min(2, window.devicePixelRatio || 1), W = innerWidth, H = innerHeight;
      cv.width = W*dpr; cv.height = H*dpr; const x = cv.getContext('2d'); x.scale(dpr, dpr);
      const cols = ['#E07A5F','#F2CC8F','#81B29A','#7FA8D1','#C49BD8','#F4A261'];
      const ps = Array.from({ length: 170 }, () => ({ x: Math.random()*W, y: -20 - Math.random()*H*0.6, vx: (Math.random()-0.5)*1.5, vy: 2 + Math.random()*3,
        r: Math.random()*6.28, vr: (Math.random()-0.5)*0.3, w: 6 + Math.random()*6, h: 4 + Math.random()*4, c: cols[Math.floor(Math.random()*cols.length)] }));
      const t0 = performance.now();
      (function frame(now){ const el = now - t0; x.clearRect(0,0,W,H);
        ps.forEach(p => { p.x += p.vx + Math.sin(el/400 + p.r)*0.6; p.y += p.vy; p.r += p.vr;
          x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.globalAlpha = el > 3200 ? Math.max(0, 1 - (el-3200)/800) : 1;
          x.fillRect(-p.w/2, -p.h/2, p.w, p.h*Math.abs(Math.cos(p.r*2)) + 1); x.restore(); });
        if (el < 4000) requestAnimationFrame(frame); else cv.remove(); })(t0);
    }

    function petLoop(){
      const keys = Object.keys(petCtl);
      for (const k of keys) {
        const c = petCtl[k];
        if (!c || !c.canvas.isConnected) { delete petCtl[k]; continue; }
        try { drawPetFrame(c); } catch (e) { /* keep loop alive */ }
      }
      requestAnimationFrame(petLoop);
    }
    requestAnimationFrame(petLoop);
    window.addEventListener('resize', () => { Object.values(petCtl).forEach(c => c && c.resize()); });
    // ===== end Pet =====

    function updateCardMeta(i) {
      const child = data.children[i];
      const total = child.tasks[data.routine].length;
      const done = doneCount(child);
      const c = document.getElementById('count-' + i);
      if (c) c.textContent = done + (total ? ' / ' + total : '');
      const f = document.getElementById('fill-' + i);
      if (f) f.style.width = (total ? Math.round(done / total * 100) : 0) + '%';
      const card = document.getElementById('card-' + i);
      if (card) card.classList.toggle('complete', total > 0 && done === total);
    }

    function render() {
      updateClock();
      const container = document.getElementById('children-container');
      container.innerHTML = '';

      data.children.forEach((child, childIndex) => {
        const total = child.tasks[data.routine].length;
        const done = doneCount(child);

        const card = document.createElement('div');
        card.className = 'child-card' + (total > 0 && done === total ? ' complete' : '');
        card.id = 'card-' + childIndex;

        const petScene = document.createElement('div');
        petScene.className = 'pet-scene';
        petScene.innerHTML = '<canvas class="pet-canvas"></canvas>' +
          '<button class="world-swap pet-swap" type="button" aria-label="Byt djur" title="Byt djur"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><ellipse cx="12" cy="16" rx="4.6" ry="3.8"/><circle cx="6" cy="10.5" r="2"/><circle cx="9.6" cy="6.5" r="2"/><circle cx="14.4" cy="6.5" r="2"/><circle cx="18" cy="10.5" r="2"/></svg></button>' +
          '<button class="world-swap" type="button" aria-label="Byt bakgrund"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19l6-8 4 5 3-4 5 7z"/><circle cx="7.5" cy="7" r="2.5"/></svg></button>';
        petScene.querySelector('.world-swap:not(.pet-swap)').addEventListener('click', (e) => { e.stopPropagation(); cycleWorld(childIndex); });
        petScene.querySelector('.pet-swap').addEventListener('click', (e) => { e.stopPropagation(); cycleSpecies(childIndex); });
        card.appendChild(petScene);
        const petCanvas = petScene.querySelector('.pet-canvas');
        petCtl[childIndex] = makeController(childIndex, petCanvas);
        petCanvas.addEventListener('click', () => tapPet(childIndex));

        const header = document.createElement('div');
        header.className = 'child-header';
        const nameElem = document.createElement('h3');
        nameElem.textContent = child.name;
        const starElem = document.createElement('div');
        starElem.className = 'stars';
        starElem.innerHTML = `<span id="count-${childIndex}">${done}${total ? ' / ' + total : ''}</span> ⭐`;
        header.appendChild(nameElem);
        header.appendChild(starElem);
        card.appendChild(header);

        const bar = document.createElement('div');
        bar.className = 'progress-bar';
        const fill = document.createElement('div');
        fill.className = 'progress-fill';
        fill.id = 'fill-' + childIndex;
        fill.style.width = (total ? Math.round(done / total * 100) : 0) + '%';
        bar.appendChild(fill);
        card.appendChild(bar);

        const list = document.createElement('div');
        list.className = 'task-list';

        child.tasks[data.routine].forEach(task => {
          const row = document.createElement('div');
          row.className = 'task' + (task.completed ? ' done' : '');
          row.dataset.taskId = task.id;

          const check = document.createElement('div');
          check.className = 'task-check';
          check.innerHTML = '<svg class="tick" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#FBFAF6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>';

          const text = document.createElement('div');
          text.className = 'task-text';
          text.textContent = task.text;

          const menu = document.createElement('button');
          menu.className = 'task-menu';
          menu.type = 'button';
          menu.textContent = '⋯';
          menu.setAttribute('aria-label', 'Alternativ');
          menu.addEventListener('click', (e) => {
            e.stopPropagation();
            openTaskMenu(childIndex, task.id);
          });

          row.appendChild(check);
          row.appendChild(text);
          row.appendChild(menu);

          row.addEventListener('click', () => {
            const wasAllDone = allDone();
            task.completed = !task.completed;
            row.classList.toggle('done', task.completed);
            saveData();
            updateCardMeta(childIndex);
            refreshPet(childIndex, true);
            if (!wasAllDone && allDone()) celebrateAll();
          });

          list.appendChild(row);
        });

        card.appendChild(list);
        container.appendChild(card);
        refreshPet(childIndex, false);
      });
    }

    // ===== Deadline clock: shown on the morning list, counts down to leaving time =====
    const DEADLINE = { h: 7, m: 45 };
    const DEADLINE_LABEL = DEADLINE.h + ':' + String(DEADLINE.m).padStart(2, '0');
    const clockEl = document.getElementById('deadline-clock');
    let clockParts = null, clockTimer = null;
    function polar(deg, r) { const a = (deg - 90) * Math.PI / 180; return [r * Math.cos(a), r * Math.sin(a)]; }
    function buildClock() {
      const NS = 'http://www.w3.org/2000/svg';
      let ticks = '', nums = '';
      for (let i = 0; i < 60; i++) {
        const hour = i % 5 === 0, [x1, y1] = polar(i * 6, hour ? 80 : 84), [x2, y2] = polar(i * 6, 90);
        ticks += `<line class="clock-tick${hour ? ' hour' : ''}" x1="${x1.toFixed(2)}" y1="${y1.toFixed(2)}" x2="${x2.toFixed(2)}" y2="${y2.toFixed(2)}"/>`;
      }
      for (let n = 1; n <= 12; n++) { const [x, y] = polar(n * 30, 67); nums += `<text class="clock-num" x="${x.toFixed(2)}" y="${y.toFixed(2)}">${n}</text>`; }
      const [mx, my] = polar(DEADLINE.m * 6, 101);
      clockEl.innerHTML =
        `<svg viewBox="-116 -110 232 220" role="img" aria-label="Klocka, klart senast ${DEADLINE_LABEL}" xmlns="${NS}">
          <circle class="clock-face" r="96"/>
          <path class="clock-wedge" d="" opacity="0.55"/>
          ${ticks}${nums}
          <line class="clock-hand hour" stroke-width="6.5" x1="0" y1="0" x2="0" y2="0"/>
          <line class="clock-hand min" stroke-width="4" x1="0" y1="0" x2="0" y2="0"/>
          <line class="clock-sec" x1="0" y1="0" x2="0" y2="0"/>
          <circle r="5" fill="var(--ink)"/><circle r="2" fill="#C4553F"/>
          <g transform="translate(${mx.toFixed(2)} ${my.toFixed(2)})">
            <circle r="15" fill="#C4553F" stroke="var(--card)" stroke-width="2.5"/>
            <text text-anchor="middle" dominant-baseline="central" font-size="16" y="1">🎒</text>
          </g>
        </svg>
        <div class="clock-caption"></div>`;
      const q = (sel) => clockEl.querySelector(sel);
      clockParts = { wedge: q('.clock-wedge'), hour: q('.clock-hand.hour'), min: q('.clock-hand.min'), sec: q('.clock-sec'), caption: q('.clock-caption') };
    }
    function setHand(el, deg, len, tail) {
      const [x2, y2] = polar(deg, len), [x1, y1] = polar(deg + 180, tail);
      el.setAttribute('x1', x1.toFixed(2)); el.setAttribute('y1', y1.toFixed(2));
      el.setAttribute('x2', x2.toFixed(2)); el.setAttribute('y2', y2.toFixed(2));
    }
    function tickClock() {
      if (!clockParts) return;
      const now = new Date();
      const s = now.getSeconds() + now.getMilliseconds() / 1000, m = now.getMinutes() + s / 60, h = (now.getHours() % 12) + m / 60;
      setHand(clockParts.hour, h * 30, 46, 8);
      setHand(clockParts.min, m * 6, 74, 10);
      setHand(clockParts.sec, s * 6, 82, 14);
      const deadline = new Date(now); deadline.setHours(DEADLINE.h, DEADLINE.m, 0, 0);
      const left = (deadline - now) / 60000; // minutes
      let wedge = '', color = '', caption, urgent = false;
      if (left > 0 && left <= 60) {
        // Time Timer style slice: from the minute hand forward to the deadline minute
        const a0 = m * 6, a1 = a0 + left * 6, [x0, y0] = polar(a0, 88), [x1, y1] = polar(a1, 88);
        wedge = `M0 0 L${x0.toFixed(2)} ${y0.toFixed(2)} A88 88 0 ${left > 30 ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z`;
        color = left > 15 ? '#7FB07A' : left > 5 ? '#E3B04F' : '#D9604A';
        urgent = left <= 5;
        const mins = Math.ceil(left);
        caption = `<b>${mins} min</b> kvar till ${DEADLINE_LABEL}`;
      } else if (left <= 0 && left > -105) {
        caption = '<b>Dags att gå!</b> 🎒';
      } else {
        caption = `Klart senast <b>${DEADLINE_LABEL}</b>`;
      }
      clockParts.wedge.setAttribute('d', wedge);
      if (color) clockParts.wedge.setAttribute('fill', color);
      clockEl.classList.toggle('urgent', urgent);
      if (clockParts.caption.innerHTML !== caption) clockParts.caption.innerHTML = caption;
    }
    function updateClock() {
      const r = data.routines.find(x => x.id === data.routine);
      const show = !!r && /morgon|morning/i.test((r.name || '') + ' ' + r.id);
      clockEl.hidden = !show;
      if (show) {
        if (!clockParts) buildClock();
        tickClock();
        if (!clockTimer) clockTimer = setInterval(tickClock, 1000);
      } else if (clockTimer) { clearInterval(clockTimer); clockTimer = null; }
    }

    function renderRoutineTabs() {
      const bar = document.getElementById('routine-toggle');
      bar.innerHTML = '';
      data.routines.filter(r => r.active !== false).forEach(r => {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = r.name;
        if (r.id === data.routine) b.classList.add('active');
        b.addEventListener('click', () => switchRoutine(r.id));
        bar.appendChild(b);
      });
    }

    function switchRoutine(routine) {
      data.routine = routine;
      saveData();
      applyThemeForRoutine();
      renderRoutineTabs();
      render();
    }

    document.getElementById('manualResetBtn').addEventListener('click', () => {
      if (!confirm('Vill du återställa rutinen?')) return;
      data.children.forEach(child => child.tasks[data.routine].forEach(t => t.completed = false));
      saveData();
      render();
    });

    const STARTER_TASKS = {
      Teddy: {
        morgon: ["Ta på kläder 👕👖🧦", "Lägga pyjamas under kudden 🛏️", "Ät frukost 🥣🥪", "Borsta tänderna 🦷🪥",
         "Lägg fram ytterkläder 🥾🧤", "Ta på ytterkläder 🦸🏼"],
        kväll:  ["Pyjamas 🩳👕", "Häng upp morgondagens kläder på krok 🪝", "Lägg i tvättkorgen 🧺🫧",
         "Borsta tänderna 🦷🪥", "Kissa 🚽", "🛌📖"],
        helg:   ["Träna på något i 30 minuter 🏋️‍♀️", "Hjälp till med en hushållssyssla 🧽", "Städa ditt rum 🧹", "Gå ut och lek 1 timme 🛝⚽️"]
      },
      Otis: {
        morgon: ["Ta på kläder 👕👖🧦", "Lägga pyjamas under kudden 🛏️", "Ät frukost 🥣🥪", "Borsta tänderna 🦷🪥",
         "Lägg fram ytterkläder 🥾🧤", "Ta på ytterkläder 🦸🏼"],
        kväll:  ["Läsa läxan 15 minuter 📖", "Packa skolväskan 🎒 (gympa, läxan, utflykt)", "Pyjamas 🩳👕", "Häng upp morgondagens kläder på krok 🪝",
         "Lägg i tvättkorgen 🧺🫧", "Borsta tänderna 🦷🪥"],
        helg:   ["Träna på något i 30 minuter 🏋️‍♀️", "Hjälp till med en hushållssyssla 🧽", "Städa ditt rum 🧹", "Gå ut och lek 1 timme 🛝⚽️"]
      },
      Loui: {
        morgon: ["Ta på kläder 👕👖🧦", "Lägga pyjamas under kudden 🛏️", "Ät frukost 🥣🥪", "Borsta tänderna 🦷🪥",
         "Lägg fram ytterkläder 🥾🧤", "Ta på ytterkläder 🦸🏼"],
        kväll:  ["Läsa läxan 15 minuter 📖", "Packa skolväskan 🎒 (gympa, läxan, utflykt)", "Pyjamas 🩳👕", "Häng upp morgondagens kläder på krok 🪝",
         "Lägg i tvättkorgen 🧺🫧", "Borsta tänderna 🦷🪥"],
        helg:   ["Träna på något i 30 minuter 🏋️‍♀️", "Hjälp till med en hushållssyssla 🧽", "Städa ditt rum 🧹", "Gå ut och lek 1 timme 🛝⚽️"]
      }
    };

    initData();
    checkDailyReset();
    applyThemeForRoutine();
    renderRoutineTabs();
    render();

    initSupabase();
    if (syncEnabled()) {
      pullState().then(migrateSpecies);
      subscribeRealtime();
    } else {
      migrateSpecies();
    }
  </script>
