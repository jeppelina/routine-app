name: Supabase keep-alive

# The free Supabase project auto-pauses after ~7 days of inactivity.
# A daily read keeps it awake so cross-device sync stays available.
# The anon key is browser-safe and already public in index.html.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

# GitHub turns off scheduled workflows after 60 days without commits; the
# last step re-enables this one on every run so the timer never runs out.
permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        env:
          SUPABASE_URL: https://bhurxoknmyfqymtiaycx.supabase.co
          ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJodXJ4b2tubXlmcXltdGlheWN4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5NzI5NTAsImV4cCI6MjA5NzU0ODk1MH0.YbblDF0jfZNzdIMy8rMF3t19b7b6onD91VVLi9N8kYg
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/households?select=id&limit=1" \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY")
          echo "Supabase responded: $code"
          if [ "$code" != "200" ]; then
            echo "::error::Supabase answered $code - the project may be paused. Restore it at https://supabase.com/dashboard"
            exit 1
          fi

      - name: Keep this scheduled workflow enabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/supabase-keepalive.yml/enable"
